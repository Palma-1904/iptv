<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fernbedienung</title>
<style>
  :root {
    --bg: #0b1220; --panel: #151f33; --panel2: #1d2a44; --text: #f1f5ff; --muted: #a9b6cf;
    --accent: #3b6cf6; --ok: #34c77b; --warn: #f0b429; --bad: #ef5350;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef2f8; --panel: #ffffff; --panel2: #e3e9f4; --text: #13203a; --muted: #5b6b86;
      --accent: #1d4ed8; --ok: #15803d; --warn: #b45309; --bad: #c62828;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .card { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 15px; }
  .now { font-size: 21px; font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .prog { font-size: 16px; margin-top: 8px; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin: 6px 0 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 0; border-radius: 12px;
    padding: 14px 8px; min-height: 56px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(.97); background: var(--accent); }
  button.big { font-size: 24px; }
  button.wide { grid-column: span 3; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
  .tabs button { min-height: 44px; padding: 8px 14px; white-space: nowrap; flex: none; }
  .tabs button.sel { background: var(--accent); color: #fff; }
  .list button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 10px 12px; min-height: 60px; background: var(--panel); }
  .list button.cur { outline: 2px solid var(--accent); }
  .list img { width: 48px; height: 32px; object-fit: contain; flex: none; }
  .list .t { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .list .s { display: block; color: var(--muted); font-size: 14px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 608px;
    margin: 0 auto; background: var(--accent); color: #fff; padding: 12px 14px; border-radius: 12px;
    opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .err { color: var(--bad); }
  h2 { font-size: 17px; margin: 18px 0 8px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .crumbs button { min-height: 40px; padding: 6px 12px; font-size: 15px; }
  .list button.dir .t::after { content: " ›"; color: var(--muted); }
  .list .c { margin-left: auto; color: var(--muted); font-size: 14px; flex: none; }
  input[type=search] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 0;
    background: var(--panel); color: var(--text); margin-bottom: 10px; }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span><span id="devname">Fernbedienung</span></h1>
<div class="tabs" id="tabs" hidden></div>
<div class="card" id="state"><span class="muted">Verbinde …</span></div>
<div class="pad" id="pad" hidden>
  <button class="big" data-a="zap" data-d="-1" aria-label="Vorheriger Sender">▲</button>
  <button class="big" data-a="toggle" aria-label="Pause oder weiter">⏯</button>
  <button class="big" data-a="stop" aria-label="Stoppen">⏹</button>
  <button class="big" data-a="zap" data-d="1" aria-label="Nächster Sender">▼</button>
  <button data-a="message">💬 Nachricht</button>
  <button data-a="reload">↻ Neu laden</button>
  <button class="wide" data-a="update" id="upd" hidden>App aktualisieren</button>
</div>
<h2 id="lhead" hidden></h2>
<div class="list" id="list"></div>
<section id="all" hidden>
  <h2>Alles auf diesem Fernseher</h2>
  <div class="crumbs" id="crumbs"></div>
  <input type="search" id="q" placeholder="Sender, Film oder Serie suchen …" hidden>
  <div class="list" id="tree"></div>
</section>
<p class="muted" id="foot"></p>
<div class="toast" id="toast"></div>
<script>
  // tree.js (derselbe Baum wie in der App) braucht nur IPTV.nativeLeaf: hier ohne Adresse, nur Kennung (norm)
  window.IPTV = {
    nativeLeaf: function (e, label, title) {
      var o = { n: label || e.name, k: e.norm, t: e.type };
      if (title && title !== o.n) o.ti = title;
      if (e.tvgId) o.id = e.tvgId;
      if (e.logo) o.l = e.logo;
      return o;
    }
  };
</script>
<script src="js/tree.js"></script>
<script>
(function () {
  'use strict';
  // Link aus dem QR-Code: #k=<geheimer Schlüssel>&db=<Firebase-Datenbank>; wird im Handy gemerkt
  var KEY = 'iptv-fernbedienung';
  var p = new URLSearchParams(location.hash.slice(1));
  var cfg = { k: p.get('k'), db: p.get('db') };
  try {
    if (cfg.k && cfg.db) localStorage.setItem(KEY, JSON.stringify(cfg));
    else cfg = JSON.parse(localStorage.getItem(KEY) || '{}');
  } catch (e) { /* privater Modus */ }
  var $ = function (id) { return document.getElementById(id); };
  if (!/^[A-Za-z0-9_-]{24,64}$/.test(cfg.k || '') ||
      !/^[a-z0-9-]+(\.[a-z0-9-]+)?\.(firebasedatabase\.app|firebaseio\.com)$/.test(cfg.db || '')) {
    $('state').innerHTML = '<span class="err">Kein gültiger Link. Bitte den QR-Code am Fernseher scannen ' +
      '(☰ 3 Sekunden halten → Weitere Einstellungen → Handy-Fernbedienung).</span>';
    return;
  }
  var BASE = 'https://' + cfg.db + '/' + cfg.k + '/';
  var devices = {}, channels = null, sel = null, chSrc = null;
  try { sel = localStorage.getItem(KEY + '-gerät'); } catch (e) { /* egal */ }

  function toast(t) {
    var el = $('toast');
    el.textContent = t;
    el.classList.add('show');
    clearTimeout(toast.h);
    toast.h = setTimeout(function () { el.classList.remove('show'); }, 3500);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function hhmm(sec) {
    var d = new Date(sec * 1000);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  var STATE = { playing: '▶ läuft', paused: '⏸ angehalten', stopped: '⏹ gestoppt', error: '⚠ Fehler',
    sleep: '💤 Schlaf-Timer', overview: '☰ in der Übersicht', tvoff: '📺 Fernseher aus', start: 'startet' };

  // Firebase-Live-Verbindung (Server-Sent Events): put/patch mit Pfad relativ zum Abo
  function live(url, onData) {
    var es = new EventSource(url);
    function handle(ev, merge) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      onData(m.path, m.data, merge);
    }
    es.addEventListener('put', function (ev) { handle(ev, false); });
    es.addEventListener('patch', function (ev) { handle(ev, true); });
    es.onerror = function () { $('foot').textContent = 'Verbindung unterbrochen – verbinde neu …'; };
    es.onopen = function () { $('foot').textContent = ''; };
    return es;
  }
  function apply(obj, path, data, merge) {
    var parts = path.split('/').filter(Boolean);
    if (!parts.length) {
      if (merge) { for (var k in data) obj[k] = data[k]; return obj; }
      return data || {};
    }
    var o = obj;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
    var last = parts[parts.length - 1];
    if (data === null) delete o[last];
    else if (merge && o[last]) for (var j in data) o[last][j] = data[j];
    else o[last] = data;
    return obj;
  }

  live(BASE + 'status.json', function (path, data, merge) {
    devices = apply(devices, path, data, merge);
    render();
  });

  function choose(id) {
    if (id === sel && chSrc) return;
    sel = id;
    try { localStorage.setItem(KEY + '-gerät', id); } catch (e) { /* egal */ }
    if (chSrc) chSrc.close();
    channels = null;
    chSrc = live(BASE + 'sender/' + encodeURIComponent(id) + '.json', function (path, data, merge) {
      channels = apply(channels || {}, path, data, merge);
      renderList();
    });
    send('watch', {}, true);   // Gerät meldet sich gleich mit frischem Stand
    render();
  }

  function render() {
    var ids = Object.keys(devices).filter(function (k) { return devices[k] && devices[k].name; });
    ids.sort(function (a, b) { return (devices[a].name || '').localeCompare(devices[b].name || ''); });
    if (!ids.length) {
      $('state').innerHTML = '<span class="muted">Noch keine Meldung vom Fernseher. Ist der Stick an und die App geöffnet?</span>';
      return;
    }
    if (ids.indexOf(sel) < 0) return choose(ids[0]);
    var tabs = $('tabs');
    tabs.hidden = ids.length < 2;
    tabs.innerHTML = '';
    ids.forEach(function (id) {
      var b = document.createElement('button');
      b.textContent = devices[id].name;
      if (id === sel) b.className = 'sel';
      b.onclick = function () { choose(id); };
      tabs.appendChild(b);
    });
    var d = devices[sel];
    var age = Date.now() / 1000 - (d.t || 0);
    $('dot').className = 'dot' + (age < 12 * 60 ? ' on' : '');
    $('devname').textContent = d.name;
    var h = '<div class="muted">' + esc(STATE[d.state] || d.state || '') +
      (age > 12 * 60 ? ' · zuletzt gemeldet vor ' + Math.round(age / 60) + ' min' : '') + '</div>';
    if (d.title) h += '<div class="now">' + esc(d.title) + '</div>';
    var epg = d.epg || [];
    var t = Date.now() / 1000;
    if (epg[0] && d.state === 'playing') {
      var pc = Math.max(0, Math.min(100, (t - epg[0][0]) / (epg[0][1] - epg[0][0]) * 100));
      h += '<div class="prog">' + hhmm(epg[0][0]) + '–' + hhmm(epg[0][1]) + '  ' + esc(epg[0][2]) + '</div>' +
        '<div class="bar"><i style="width:' + pc.toFixed(0) + '%"></i></div>';
      if (epg[1]) h += '<div class="muted">danach ' + hhmm(epg[1][0]) + '  ' + esc(epg[1][2]) + '</div>';
    }
    if (d.note && d.noteT && t - d.noteT < 120) h += '<div class="muted">↩ ' + esc(d.note) + '</div>';
    $('state').innerHTML = h;
    $('pad').hidden = false;
    $('upd').hidden = !d.cfg;   // nur mit dem Haupt-Link aus dem Editor
    renderList();
    adminFor(d);
  }

  // ---------- Admin (nur Haupt-Link): ganze Liste des Sticks – Live TV, Filme, Serien, Suche ----------
  // Der Editor legt unter <kanal>/lists die Einrichtungs-Links ab; die Handy-Codes einzelner Sticks haben keine.
  var lists = null, trees = {}, nav = [], shownList = null, query = '';
  fetch(BASE + 'lists.json').then(function (r) { return r.ok ? r.json() : null; })
    .then(function (l) { lists = l; if (sel && devices[sel]) adminFor(devices[sel]); })
    .catch(function () { /* keine Admin-Ansicht */ });

  function norm(u) { return u.replace(/^https?:\/\/[^\/]+\/(live|movie|series)\/[^\/]+\/[^\/]+\//, '$1/'); }
  function parseM3u(text) {
    var out = [], cur = null, lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line.indexOf('#EXTINF') === 0) {
        var q = false, c = -1;
        for (var j = 0; j < line.length; j++) {
          if (line[j] === '"') q = !q;
          else if (line[j] === ',' && !q) { c = j; break; }
        }
        var head = c >= 0 ? line.slice(0, c) : line, a = {}, m, re = /([\w-]+)="([^"]*)"/g;
        while ((m = re.exec(head))) a[m[1].toLowerCase()] = m[2].trim();
        cur = { name: (c >= 0 ? line.slice(c + 1).trim() : '') || a['tvg-name'] || 'Unbenannt',
          group: a['group-title'] || 'Sonstige', logo: a['tvg-logo'] || '', tvgId: a['tvg-id'] || '',
          work: a['x-work'] || '', lang: (a['x-lang'] || '').toUpperCase(),
          type: /^(live|movie|series)$/.test(a['tvg-type']) ? a['tvg-type'] : 'live' };
      } else if (line && line[0] !== '#' && /^https?:\/\//i.test(line)) {
        var e = cur || { name: line, group: 'Sonstige', logo: '', tvgId: '', work: '', lang: '', type: 'live' };
        if (e.type === 'series') e.name = e.name.replace(/\b(S\d{1,3}) (E\d{1,4})\b/, '$1$2');
        e.norm = norm(line);
        out.push(e);
        cur = null;
      }
    }
    return out;
  }
  function loadList(slug) {
    if (trees[slug]) return trees[slug];
    var info = lists[slug], p = info.link.split('/');
    var base = 'https://gist.githubusercontent.com/' + p[0] + '/' + p[1] + '/raw/' + (info.rev ? info.rev + '/' : '');
    var fresh = info.rev ? '' : '?t=' + Date.now();
    trees[slug] = Promise.all([
      fetch(base + p[2] + '.m3u' + fresh).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }),
      fetch(base + p[2] + '.epg.json' + fresh).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]).then(function (res) {
      return { root: IPTV.buildTree(parseM3u(res[0])).root, epg: res[1] && res[1].channels ? res[1].channels : {} };
    });
    trees[slug].catch(function () { delete trees[slug]; });
    return trees[slug];
  }

  function adminFor(d) {
    if (!lists || !d.list || !lists[d.list]) { $('all').hidden = true; return; }
    $('all').hidden = false;
    if (shownList !== d.list) {
      shownList = d.list;
      nav = [];
      query = '';
      $('tree').innerHTML = '<p class="muted">Lade Liste „' + esc(lists[d.list].name) + '“ …</p>';
      loadList(d.list).then(function () { drawTree(); }, function (e) {
        $('tree').innerHTML = '<p class="err">Liste nicht ladbar: ' + esc(e.message) + '</p>';
      });
    } else if (d.norm !== adminFor.norm) {
      drawTree();   // anderer Sender läuft: neu markieren
    }
    adminFor.norm = d.norm;
  }

  function nowTitle(epg, id) {
    var p = id && epg[id], t = Date.now() / 1000;
    if (!p) return '';
    for (var i = 0; i < p.length; i++) if (p[i][0] <= t && p[i][1] > t) return p[i][2];
    return '';
  }
  function countLeaves(n) {
    if (!n.c) return n.s ? 0 : 1;
    var k = 0;
    n.c.forEach(function (x) { k += countLeaves(x); });
    return k;
  }
  function fold(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  var LIMIT = 300;
  function drawTree(limit) {
    var slug = shownList;
    if (!slug || !trees[slug]) return;
    trees[slug].then(function (data) {
      if (slug !== shownList) return;
      limit = limit || LIMIT;
      var cur = (devices[sel] || {}).norm;
      // Brotkrumen
      var cr = $('crumbs');
      cr.innerHTML = '';
      var top = document.createElement('button');
      top.textContent = 'Übersicht';
      top.onclick = function () { nav = []; drawTree(); };
      cr.appendChild(top);
      nav.forEach(function (n, i) {
        var b = document.createElement('button');
        b.textContent = n.n;
        b.onclick = function () { nav = nav.slice(0, i + 1); drawTree(); };
        cr.appendChild(b);
      });
      var node = nav.length ? nav[nav.length - 1] : { c: data.root };
      var box = $('tree');
      box.innerHTML = '';
      var search = !!node.s;
      $('q').hidden = !search;
      var items = node.c || [];
      if (search) {
        var q = fold(query.trim());
        items = [];
        if (q.length >= 2) {
          // Treffer: Sender/Filme/Folgen und ganze Serien bzw. Gruppen (dann darin weiter blättern)
          (function walk(n, depth) {
            (n.c || []).forEach(function (x) {
              if (x.s) return;
              if (depth > 0 && fold(x.ti || x.n).indexOf(q) >= 0) items.push(x);
              else if (x.c) walk(x, depth + 1);
            });
          })({ c: data.root }, 0);
        }
        if (q.length < 2) box.innerHTML = '<p class="muted">Mindestens 2 Buchstaben eingeben.</p>';
        else if (!items.length) box.innerHTML = '<p class="muted">Nichts gefunden.</p>';
      }
      items.slice(0, limit).forEach(function (x) {
        var b = document.createElement('button');
        if (x.k) {
          if (x.k === cur) b.className = 'cur';
          var sub = x.t === 'live' ? nowTitle(data.epg, x.id) : '';
          var name = search && x.ti ? x.ti : x.n;
          b.innerHTML = (x.l ? '<img alt="" loading="lazy" src="' + esc(x.l.replace(/^http:/, 'https:')) + '" onerror="this.style.display=\'none\'">' : '') +
            '<span><span class="t">' + esc(name) + '</span>' + (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</span>';
          b.onclick = function () {
            send('play', { norm: x.k });
            toast('Startet auf dem Fernseher: ' + name);
          };
        } else {
          b.className = 'dir';
          var n = x.s ? '' : countLeaves(x);
          b.innerHTML = '<span><span class="t">' + esc(x.n) + '</span></span>' + (n ? '<span class="c">' + n + '</span>' : '');
          b.onclick = function () {
            nav.push(x);
            if (x.s) setTimeout(function () { $('q').focus(); }, 50);
            drawTree();
            $('all').scrollIntoView({ behavior: 'smooth' });
          };
        }
        box.appendChild(b);
      });
      if (items.length > limit) {
        var more = document.createElement('button');
        more.textContent = 'Weitere ' + (items.length - limit) + ' anzeigen';
        more.onclick = function () { drawTree(limit + LIMIT); };
        box.appendChild(more);
      }
    });
  }
  $('q').addEventListener('input', function () {
    query = this.value;
    clearTimeout(drawTree.h);
    drawTree.h = setTimeout(function () { drawTree(); }, 250);
  });

  function renderList() {
    var d = devices[sel] || {};
    var c = channels && channels.items ? channels : null;
    $('lhead').hidden = !c;
    $('list').innerHTML = '';
    if (!c) return;
    $('lhead').textContent = c.group || 'Sender';
    c.items.forEach(function (it) {
      var b = document.createElement('button');
      if (it.k === d.norm) b.className = 'cur';
      b.innerHTML = (it.l ? '<img alt="" loading="lazy" src="' + esc(it.l.replace(/^http:/, 'https:')) + '" onerror="this.style.display=\'none\'">' : '') +
        '<span><span class="t">' + esc(it.n) + '</span>' + (it.now ? '<span class="s">' + esc(it.now) + '</span>' : '') + '</span>';
      b.onclick = function () { send('play', { norm: it.k }); toast('Schalte um auf ' + it.n + ' …'); };
      $('list').appendChild(b);
    });
  }

  function send(action, arg, quiet) {
    if (!sel) return;
    return fetch(BASE + 'inbox/' + encodeURIComponent(sel) + '.json', {
      method: 'POST',
      body: JSON.stringify({ action: action, arg: arg || {}, t: Math.floor(Date.now() / 1000) })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (!quiet) toast('Gesendet ✓');
    }).catch(function (e) { if (!quiet) toast('Nicht gesendet: ' + e.message); });
  }

  document.querySelectorAll('#pad button').forEach(function (b) {
    b.onclick = function () {
      var a = b.getAttribute('data-a');
      if (a === 'message') {
        var text = prompt('Nachricht für den Fernseher:');
        if (text) send('message', { text: text });
        return;
      }
      if (a === 'update' && !confirm('Neue App-Version laden und installieren?')) return;
      send(a, a === 'zap' ? { d: +b.getAttribute('data-d') } : {});
    };
  });
  // Laufende Sendung (Fortschritt) jede Minute neu zeichnen
  setInterval(render, 60000);
})();
</script>
</body>
</html>
