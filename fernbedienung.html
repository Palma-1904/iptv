<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fernbedienung</title>
<link rel="manifest" href="fernbedienung.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b1220; --panel: #151f33; --panel2: #1d2a44; --text: #f1f5ff; --muted: #a9b6cf;
    --accent: #3b6cf6; --ok: #34c77b; --warn: #f0b429; --bad: #ef5350;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef2f8; --panel: #ffffff; --panel2: #e3e9f4; --text: #13203a; --muted: #5b6b86;
      --accent: #1d4ed8; --ok: #15803d; --warn: #b45309; --bad: #c62828;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .card { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 15px; }
  .now { font-size: 21px; font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .prog { font-size: 16px; margin-top: 8px; }
  .desc { font-size: 14px; line-height: 1.35; margin-top: 6px; opacity: .85; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin: 6px 0 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 0; border-radius: 12px;
    padding: 14px 8px; min-height: 56px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(.97); background: var(--accent); }
  button.big { font-size: 24px; }
  button.wide { grid-column: span 3; }
  #devsel { width: 100%; font: inherit; font-size: 18px; font-weight: 600; padding: 12px 14px; border-radius: 12px;
    border: 0; background: var(--panel2); color: var(--text); margin-bottom: 12px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
  .tabs button { min-height: 44px; padding: 8px 14px; white-space: nowrap; flex: none; }
  .tabs button.sel { background: var(--accent); color: #fff; }
  .list button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 10px 12px; min-height: 60px; background: var(--panel); }
  .list button.cur { outline: 2px solid var(--accent); }
  .list img { width: 48px; height: 32px; object-fit: contain; flex: none; }
  .list .t { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .list .s { display: block; color: var(--muted); font-size: 14px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 608px;
    margin: 0 auto; background: var(--accent); color: #fff; padding: 12px 14px; border-radius: 12px;
    opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .err { color: var(--bad); }
  #warn { background: var(--panel); border-left: 4px solid var(--warn); border-radius: 12px; padding: 10px 14px;
    margin-bottom: 12px; font-size: 15px; }
  #warn div { margin: 3px 0; }
  #warn .whead { width: 100%; display: flex; gap: 8px; background: none; padding: 2px 0; min-height: 36px;
    text-align: left; font-weight: 600; }
  .memo { font-size: 15px; color: var(--muted); margin: -6px 0 10px; }
  .fold .seg { display: flex; gap: 8px; margin-bottom: 8px; }
  .fold .seg button { flex: 1; min-height: 46px; }
  .fold .seg button.sel { background: var(--accent); color: #fff; }
  .fold select { width: 100%; font: inherit; padding: 12px; border-radius: 12px; border: 0; background: var(--panel2);
    color: var(--text); margin-bottom: 8px; }
  .list .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .list .row > button { margin-bottom: 0; }
  .list .row > button.main { flex: 1; width: auto; min-width: 0; }
  .list .row > button.bell { flex: none; width: 56px; justify-content: center; padding: 0; font-size: 20px; }
  .list .row > button.bell { opacity: .45; }
  .list .row > button.bell.set, .list .row > button.bell.open { opacity: 1; }
  .list .row > button.bell.open { background: var(--accent); }
  .list .prog { margin: 0 0 10px 16px; }
  .list .prog button { min-height: 46px; font-size: 15px; padding: 8px 12px; margin-bottom: 6px; }
  .list .prog button.on { outline: 2px solid var(--warn); }
  .list .prog .tm { flex: none; width: 74px; color: var(--muted); }
  #rems .x { margin-left: auto; color: var(--muted); flex: none; }
  #live { grid-column: span 3; }
  #liveimg { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 8px; display: block; }
  #live p { margin: 6px 0 0; }
  .remote { padding: 12px; }
  .rrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
  .rrow button { min-height: 56px; font-size: 20px; }
  .rrow button.pw.on { background: var(--warn); color: #1b1300; }
  .rrow button.sel { background: var(--accent); color: #fff; }
  .remote .rrow:last-of-type button { font-size: 15px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 12px; align-items: center; }
  .dpad button { min-height: 64px; font-size: 26px; }
  .dpad button.ok { background: var(--accent); color: #fff; font-weight: 700; border-radius: 50%; aspect-ratio: 1;
    min-height: 0; width: 84px; justify-self: center; font-size: 22px; }
  #live { margin-bottom: 10px; }
  .remote > p { margin: 0; font-size: 14px; }
  .state-upd { margin-top: 10px; width: 100%; }
  .fold { padding: 0; }
  .fold > button.head { width: 100%; background: none; text-align: left; display: flex; gap: 8px; min-height: 52px; }
  .fold .body { padding: 0 14px 14px; }
  .fold .sw { display: flex; width: 100%; justify-content: space-between; margin-bottom: 8px; min-height: 50px;
    padding: 10px 14px; text-align: left; }
  .fold .sw b { color: var(--muted); font-weight: 600; }
  .fold .sw.on b { color: var(--ok); }
  .fold .chk { margin: 4px 0; font-size: 15px; }
  .fold .chk.no { color: var(--bad); }
  .fold .chk.yes { color: var(--ok); }
  .ver { margin-top: 8px; font-size: 15px; color: var(--muted); }
  .ver b { color: var(--text); }
  .ver.old { color: var(--warn); }
  button.hot { background: var(--warn); color: #1b1300; }
  h2 { font-size: 17px; margin: 18px 0 8px; }
  .list button.dir { background: var(--panel2); min-height: 52px; }
  .list button.dir.open { background: var(--accent); color: #fff; position: sticky; top: 0; z-index: 1; }
  .list button.dir.open .c { color: #e6ecff; }
  .list .arrow { width: 16px; flex: none; }
  .list .c { margin-left: auto; color: var(--muted); font-size: 14px; flex: none; }
  #conn { padding: 10px 14px; font-size: 15px; }
  #conn .z { display: flex; gap: 8px; margin: 3px 0; }
  #conn .z b { flex: none; width: 46px; }
  #conn .z.busy2 { color: var(--bad); font-weight: 600; }
  .fold .sched { background: var(--panel2); border-radius: 12px; padding: 10px 12px; margin: 4px 0 10px; }
  .fold .sched label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0; }
  .fold .sched input, .fold .sched select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 0;
    background: var(--panel); color: var(--text); width: auto; margin: 0; }
  .fold .sched .sw { margin: 8px 0 6px; background: var(--accent); color: #fff; }
  .fold .ml { background: var(--panel2); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .fold .ml .mh { display: flex; align-items: center; gap: 6px; }
  .fold .ml .mh .nm { flex: 1; font-weight: 600; text-align: left; background: none; padding: 8px 4px; min-height: 44px; }
  .fold .ml button.s { min-height: 40px; padding: 6px 10px; font-size: 15px; background: var(--panel); flex: none; }
  .fold .ml .it { display: flex; align-items: center; gap: 6px; margin: 4px 0 4px 8px; font-size: 15px; }
  .fold .ml .it span { flex: 1; overflow-wrap: anywhere; }
  .fold .ml input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--panel);
    color: var(--text); margin: 6px 0; }
  .fold .ml .hit { display: block; width: 100%; text-align: left; min-height: 44px; padding: 8px 10px; margin-bottom: 4px;
    background: var(--panel); font-size: 15px; }
  .fold .eb { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
  .fold .eb button { flex: 1 1 45%; min-height: 48px; font-size: 15px; }
  .fold .eb button.hot { flex-basis: 100%; }
  .fold .elog { font-size: 14px; margin: 4px 0 8px; }
  .fold .elog.bad { color: var(--bad); }
  .fold .lk { background: var(--panel2); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .fold .lk .row2 { display: flex; gap: 8px; margin-top: 8px; }
  .fold .lk .row2 button { flex: 1; min-height: 46px; background: var(--panel); }
  .fold .lk select { margin: 8px 0; }
  .fold .lk .qr { background: #fff; border-radius: 10px; padding: 10px; margin-top: 8px; text-align: center; }
  .fold .lk .qr svg { width: 220px; height: 220px; }
  .btabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .btabs button { min-height: 48px; font-size: 16px; }
  .btabs button.sel { background: var(--accent); color: #fff; }
  #bgrp { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 0;
    background: var(--panel2); color: var(--text); margin-bottom: 10px; }
  .list .vrow { display: none; flex-wrap: wrap; gap: 6px; margin: -4px 0 10px 16px; }
  .list .openv .vrow, .list .vrow.langs { display: flex; }
  .list .vrow button { width: auto; min-height: 40px; padding: 6px 12px; margin: 0; font-size: 15px; }
  .list .vrow button.sel { background: var(--accent); color: #fff; }
  .list .eps { margin-left: 16px; }
  .list button.more { justify-content: center; color: var(--accent); }
  input[type=search] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 0;
    background: var(--panel); color: var(--text); margin-bottom: 10px; }
  /* Jeder Bereich auf-/zuklappbar (Hülle .sec um die eigentlichen Inhalte, Zustand gemerkt) */
  .fold > button.head { font-weight: 600; font-size: 17px; align-items: center; padding: 10px 14px; }
  .sec > button.head .sum { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .sec.shut > .body { display: none; }
  .sec:not(.shut) > button.head .sum { display: none; }   /* Kurzinfo nur im zugeklappten Zustand */
  .sec > .body > .card { padding: 0; margin: 0; background: none; }
  .sec .list button { background: var(--panel2); }
  .sec.group > .body > .card { background: var(--panel2); margin-bottom: 8px; }
  #ov button .s b { color: var(--warn); font-weight: 600; }
  .sec > .body > section > h2, .sec > .body > h2 { display: none; }
  /* Kurzleiste unten: erscheint, wenn die große Fernbedienung nicht zu sehen ist (weggescrollt/zugeklappt) */
  .qbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 6px; justify-content: center;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--panel);
    box-shadow: 0 -2px 12px rgba(0, 0, 0, .18); }
  .qbar button { flex: 1; max-width: 110px; min-height: 50px; font-size: 22px; padding: 6px; }
  .qbar button.ok { background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
  /* Platz für die Leiste ist fest reserviert, solange es eine Fernbedienung gibt (auch wenn die Leiste gerade nicht
     zu sehen ist): die Seite endet an der Oberkante der Leiste, nichts verschwindet dauerhaft dahinter, nichts springt */
  body.hasq { padding-bottom: calc(var(--qbh, 74px) + 16px); }
  html.hasq { scroll-padding-bottom: calc(var(--qbh, 74px) + 12px); }   /* Aufgeklapptes/Eingaben über der Leiste */
  body.hasq .toast { bottom: calc(var(--qbh, 74px) + 10px); }
  body.typing .qbar { display: none; }
  /* Listen werden beim Aktualisieren neu gezeichnet: die Scroll-Verankerung des Browsers würde dabei springen */
  #tree, #list, #rems { overflow-anchor: none; }   /* Tastatur offen: Leiste weg, damit sie nicht über dem Eingabefeld hängt */
  .foldall { display: flex; gap: 8px; margin: -4px 0 12px; }
  .foldall button { flex: 1; min-height: 40px; padding: 6px 10px; font-size: 14px; background: var(--panel); }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span><span id="devname">Fernbedienung</span></h1>
<div id="warn" hidden></div>
<div class="card" id="conn" hidden></div>
<div class="list" id="ov" hidden></div>
<select id="devsel" hidden aria-label="Fernseher wählen"></select>
<div class="foldall" id="foldall" hidden><button data-f="0">▸ Alle zuklappen</button><button data-f="1">▾ Alle aufklappen</button></div>
<div class="card" id="state"><span class="muted">Verbinde …</span></div>
<div class="card remote" id="remote" hidden>
  <div class="rrow">
    <button id="power" class="pw" hidden>⏻</button>
    <button data-k="menu" aria-label="Menü">☰</button>
    <button data-k="back" aria-label="Zurück">↩</button>
    <button id="livebtn" hidden aria-label="Livebild">📷</button>
  </div>
  <div id="live" hidden>
    <img id="liveimg" alt="Bild vom Fernseher">
    <p class="muted" id="liveinfo">Warte auf das erste Bild …</p>
  </div>
  <div class="dpad">
    <span></span><button data-k="up" class="big" aria-label="Hoch">▲</button><span></span>
    <button data-k="left" class="big" aria-label="Links">◀</button>
    <button data-k="ok" class="ok" aria-label="OK">OK</button>
    <button data-k="right" class="big" aria-label="Rechts">▶</button>
    <span></span><button data-k="down" class="big" aria-label="Runter">▼</button><span></span>
  </div>
  <div class="rrow">
    <button data-k="rew" aria-label="Zurückspulen">⏪</button>
    <button data-k="playpause" aria-label="Play/Pause">⏯</button>
    <button data-k="ff" aria-label="Vorspulen">⏩</button>
  </div>
  <div class="rrow">
    <button data-a="stop">⏹ Stopp</button>
    <button data-a="message">💬 Nachricht</button>
    <button data-a="reload">↻ Neu laden</button>
  </div>
  <p class="muted">▲▼ schaltet beim Fernsehen die Sender um, ☰ öffnet die Senderliste. Wirkt nur in „Fernsehen“,
    jeder Druck braucht etwa eine Sekunde.</p>
</div>
<div class="card fold" id="cfg" hidden></div>
<div class="list" id="rems"></div>
<h2 id="lhead" hidden></h2>
<div class="list" id="list"></div>
<section id="all" hidden>
  <h2>Alles auf diesem Fernseher</h2>
  <div class="btabs" id="btabs"></div>
  <input type="search" id="q" placeholder="🔍 Sender, Film oder Serie suchen …">
  <select id="bgrp" aria-label="Gruppe wählen"></select>
  <div class="list" id="tree"></div>
</section>
<div class="card fold" id="ntf" hidden></div>
<div class="card fold" id="myl" hidden></div>
<div class="card fold" id="edi" hidden></div>
<div class="card fold" id="adm" hidden></div>
<p class="muted" id="foot"></p>
<div class="qbar" id="qbar" hidden>
  <button data-k="menu" aria-label="Senderliste">☰</button>
  <button data-k="up" aria-label="Hoch">▲</button>
  <button data-k="ok" class="ok" aria-label="OK">OK</button>
  <button data-k="down" aria-label="Runter">▼</button>
  <button data-k="playpause" aria-label="Play/Pause">⏯</button>
  <button data-k="back" aria-label="Zurück">↩</button>
</div>
<div class="toast" id="toast"></div>
<script>
  // tree.js (derselbe Baum wie in der App) braucht nur IPTV.nativeLeaf: hier ohne Adresse, nur Kennung (norm)
  window.IPTV = {
    nativeLeaf: function (e, label, title) {
      var o = { n: label || e.name, k: e.norm, t: e.type };
      if (title && title !== o.n) o.ti = title;
      if (e.tvgId) o.id = e.tvgId;
      if (e.logo) o.l = e.logo;
      if (e.sids) o.s = e.sids;
      return o;
    }
  };
</script>
<script src="js/tree.js"></script>
<script>
(function () {
  'use strict';
  // Link aus dem QR-Code: #k=<geheimer Schlüssel>&db=<Firebase-Datenbank>; wird im Handy gemerkt
  var KEY = 'iptv-fernbedienung';
  var p = new URLSearchParams(location.hash.slice(1));
  var cfg = { k: p.get('k'), db: p.get('db') };
  try {
    if (cfg.k && cfg.db) localStorage.setItem(KEY, JSON.stringify(cfg));
    else cfg = JSON.parse(localStorage.getItem(KEY) || '{}');
  } catch (e) { /* privater Modus */ }
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Jeder Bereich auf-/zuklappbar (gemerkt je Handy) ----------
  // Die Inhalte bleiben, wie sie sind; um sie kommt eine Hülle mit Kopfzeile. Ist der Inhalt versteckt oder leer,
  // verschwindet auch die Hülle. Die übrigen Karten (⚙️, 🔔, 📋, 🖥, 🔗) klappen schon selbst.
  var SECS = [   // id, Titel, anfangs offen?, [weitere Teile] (Admin: Übersicht und Verwaltung)
    ['conn', '📡 Wer schaut gerade', false],
    ['ov', '📺 Alle Fernseher', true],
    ['state', '▶ Was läuft', true],
    ['remote', '🎮 Fernbedienung', true],
    ['rems', '🔔 Erinnerungen', false],
    ['list', '📺 Sender', true],
    ['all', '📺 Alles auf diesem Fernseher', false],
    ['ntf', '🛠 Verwaltung', false, ['ntf', 'myl', 'edi', 'adm']]
  ];
  var secOpen = {};
  try { secOpen = JSON.parse(localStorage.getItem(KEY + '-open') || '{}') || {}; } catch (e) { /* privat */ }
  var secs = {};
  function secSave() { try { localStorage.setItem(KEY + '-open', JSON.stringify(secOpen)); } catch (e) { /* privat */ } }
  function secSet(id, open) {
    var x = secs[id];
    if (!x) return;
    secOpen[id] = open;
    x.wrap.classList.toggle('shut', !open);
    x.arrow.textContent = open ? '▾' : '▸';
    x.head.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function secTitle(id, t) { if (secs[id]) secs[id].title.textContent = t; }
  function secSum(id, t) { if (secs[id]) secs[id].sum.textContent = t || ''; }
  function secSync(id) {
    var x = secs[id];
    x.wrap.hidden = x.parts.every(function (el) { return el.hidden || !el.childNodes.length || el.id === 'lhead'; });
    var any = Object.keys(secs).some(function (k) { return !secs[k].wrap.hidden; });
    $('foldall').hidden = !any;
  }
  SECS.forEach(function (d) {
    var el = $(d[0]);
    if (!el) return;
    var parts = d[3] ? d[3].map($) : d[0] === 'list' ? [$('lhead'), el] : [el];
    var wrap = document.createElement('div');
    wrap.className = 'card fold sec' + (d[3] ? ' group' : '');
    wrap.hidden = true;
    var head = document.createElement('button');
    head.className = 'head';
    head.type = 'button';
    var arrow = document.createElement('span'), title = document.createElement('span'), sum = document.createElement('span');
    title.textContent = d[1];
    sum.className = 'sum';
    head.appendChild(arrow); head.appendChild(title); head.appendChild(sum);
    var body = document.createElement('div');
    body.className = 'body';
    parts[0].parentNode.insertBefore(wrap, parts[0]);
    wrap.appendChild(head);
    wrap.appendChild(body);
    parts.forEach(function (p) { body.appendChild(p); });
    secs[d[0]] = { wrap: wrap, head: head, arrow: arrow, title: title, sum: sum, parts: parts };
    head.onclick = function () {
      secSet(d[0], wrap.classList.contains('shut'));
      secSave();
      if (d[0] === 'ov') render();   // Übersicht zu → Auswahlliste wieder zeigen
    };
    secSet(d[0], d[0] in secOpen ? !!secOpen[d[0]] : d[2]);
    var mo = new MutationObserver(function () { secSync(d[0]); });
    parts.forEach(function (p) { mo.observe(p, { attributes: true, attributeFilter: ['hidden'], childList: true }); });
    secSync(d[0]);
  });
  // „Alle zu/auf“ gilt auch für die Karten, die selbst klappen (über ihre Kopfzeile)
  Array.prototype.forEach.call($('foldall').querySelectorAll('button'), function (b) {
    b.onclick = function () {
      var open = b.getAttribute('data-f') === '1';
      Object.keys(secs).forEach(function (k) { secSet(k, open); });
      secSave();
      render();
      (open ? ['cfg'] : ['cfg', 'ntf', 'myl', 'edi', 'adm']).forEach(function (id) {   // Verwaltung: Karten bleiben zu
        var c = $(id), h = c && !c.hidden && c.querySelector(':scope > button.head');
        if (h && (h.textContent.charAt(0) === '▾') !== open) h.click();

  // ---------- Wer schaut gerade womit (nur Haupt-Link): je Zugang/Liste nur EINE Verbindung ----------

  function busyByList(ids) {

  // ---------- 🔔 Benachrichtigungen (nur Haupt-Link): Web-Push vom Mac, Banner + rote Zahl am Symbol ----------
  // iPhone: nur als Home-Bildschirm-App (iOS 16.4+). Anmeldung nach <kanal>/push/subs/<id>, Schlüssel <kanal>/push/vapid.
  var ntfOpen = false, ntfState = '', alertsSrc = null, alertsN = 0;
  function standalone() { return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
  function subId(ep) { var h = 0; for (var i = 0; i < ep.length; i++) h = (h * 31 + ep.charCodeAt(i)) | 0; return 's' + (h >>> 0).toString(36); }
  function b64uToBytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function swReg() {
    return navigator.serviceWorker.register('sw-admin.js', { scope: './fernbedienung' });
  }
  function ntfCheck() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { ntfState = 'unsupported'; return renderNtf(); }
    if (!standalone() && /iPhone|iPad/.test(navigator.userAgent)) { ntfState = 'install'; return renderNtf(); }
    swReg().then(function (r) { return r.pushManager.getSubscription(); })
      .then(function (sub) { ntfState = sub ? 'on' : 'off'; renderNtf(); }, function () { ntfState = 'off'; renderNtf(); });
  }
  function ntfOn() {
    var reg;
    Notification.requestPermission().then(function (p) {
      if (p !== 'granted') throw new Error('Mitteilungen nicht erlaubt (Einstellungen → Mitteilungen → Fernbedienung)');
      return swReg();
    }).then(function (r) {
      reg = r;
      // Zugang für den Service Worker (holt dort Titel/Text der Meldung)
      return caches.open('admin-cfg').then(function (c) { return c.put('cfg', new Response(JSON.stringify({ db: cfg.db, k: cfg.k }))); });
    }).then(function () {
      return fetch(BASE + 'push/vapid.json').then(function (r) { return r.json(); });
    }).then(function (key) {
      if (!key) throw new Error('Noch kein Schlüssel – bitte einmal den Editor am Mac starten (legt ihn an)');
      return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(key) });
    }).then(function (sub) {
      var j = sub.toJSON();
      return fetch(BASE + 'push/subs/' + subId(j.endpoint) + '.json', { method: 'PUT',
        body: JSON.stringify({ endpoint: j.endpoint, ua: navigator.userAgent.slice(0, 80), t: Math.floor(Date.now() / 1000) }) });
    }).then(function () { ntfState = 'on'; toast('🔔 Benachrichtigungen eingeschaltet'); renderNtf(); })
      .catch(function (e) { toast(e.message); });
  }
  function ntfOff() {
    swReg().then(function (r) { return r.pushManager.getSubscription(); }).then(function (sub) {
      if (!sub) return;
      fetch(BASE + 'push/subs/' + subId(sub.endpoint) + '.json', { method: 'DELETE' }).catch(function () {});
      return sub.unsubscribe();
    }).then(function () { ntfState = 'off'; renderNtf(); toast('Benachrichtigungen aus'); });
  }
  function setBadge(n) {
    try { if (navigator.setAppBadge) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(function () {}); } catch (e) { /* egal */ }
  }
  function renderNtf() {
    var box = $('ntf');

    if (!ntfState) { ntfState = '…'; ntfCheck(); }
    box.innerHTML = '';
    var head = document.createElement('button');
    head.className = 'head';
    head.innerHTML = '<span>' + (ntfOpen ? '▾' : '▸') + '</span><span>🔔 Benachrichtigungen aufs iPhone: ' +
      ({ on: 'an ✓', off: 'aus', install: 'aus', unsupported: 'nicht möglich' }[ntfState] || '…') + '</span>';
    head.onclick = function () { ntfOpen = !ntfOpen; renderNtf(); };
    box.appendChild(head);
    if (!ntfOpen) return;
    var body = document.createElement('div');
    body.className = 'body';
    var p = document.createElement('p');
    p.className = 'muted';
    p.style.marginTop = '0';
    p.textContent = 'Banner und rote Zahl am Symbol bei: Stick länger als 24 h aus, Programm veraltet, Abo läuft ab, Stick aktualisiert nicht. Kommt vom Mac (Automatik stündlich, Editor sofort).';
    body.appendChild(p);
    function b(text, fn, cls) { var x = document.createElement('button'); x.className = 'sw' + (cls ? ' ' + cls : ''); x.innerHTML = '<span>' + text + '</span><b></b>'; x.onclick = fn; body.appendChild(x); }
    if (ntfState === 'install') {
      p.insertAdjacentHTML('afterend', '<p>So geht es auf dem iPhone: in Safari unten <b>Teilen</b> → <b>„Zum Home-Bildschirm“</b>, dann die Fernbedienung <b>vom Home-Bildschirm</b> öffnen und hier „Einschalten“ tippen.</p>');
    } else if (ntfState === 'unsupported') {
      p.insertAdjacentHTML('afterend', '<p>Dieser Browser kann keine Benachrichtigungen (iPhone: iOS 16.4 oder neuer nötig).</p>');
    } else if (ntfState === 'off') {
      b('🔔 Auf diesem Gerät einschalten', ntfOn, 'hot');
    } else if (ntfState === 'on') {
      b('Test-Nachricht schicken (über den Editor am Mac)', function () { ediSend('pushtest', {}, 'Test-Nachricht'); });
      b('Auf diesem Gerät ausschalten', ntfOff);

  // ---------- Eigene Listen (nur Haupt-Link): je Playlist zentral in Firebase <db>/<my>.json ----------
  // { l: { <id>: { n: Name, o: Reihenfolge, i: [norm, …] } } } – Geräte der Playlist zeigen sie sofort ganz oben.
  var mylOpen = false, mylSlug = null, mylData = {}, mylSrc = null, mylSrcKey = null, mylOpenId = null, mylQuery = '';
  function mylUrl(slug, sub) { return 'https://' + cfg.db + '/' + lists[slug].my + (sub || '') + '.json'; }
  function mylPut(id, x) {
    return fetch(mylUrl(mylSlug, '/l/' + encodeURIComponent(id)), { method: x ? 'PUT' : 'DELETE', body: x ? JSON.stringify(x) : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
      .catch(function (e) { toast('Nicht gespeichert: ' + e.message); });
  }
  function mylItems(x) { return Array.isArray(x.i) ? x.i.slice() : Object.keys(x.i || {}).map(function (k) { return x.i[k]; }); }
  function mylSorted() {
    var l = mylData.l || {};
    return Object.keys(l).filter(function (id) { return l[id] && l[id].n; })
      .sort(function (a, b) { return (+l[a].o || 0) - (+l[b].o || 0) || l[a].n.localeCompare(l[b].n); });
  }
  // Namen/Logos zu den Kennungen aus dem Baum der Liste (derselbe wie „Alles auf diesem Fernseher“)
  var mylNames = {};
  function mylLeaves(slug) {
    if (mylNames[slug]) return mylNames[slug];
    mylNames[slug] = loadList(slug).then(function (data) {
      var out = {}, live = [];
      (function walk(nodes, isLive) {
        (nodes || []).forEach(function (n) {
          if (n.k) { if (!out[n.k]) { out[n.k] = n; if (isLive && n.t === 'live') live.push(n); } }
          else walk(n.c, isLive || n.n === 'Live TV');
        });
      })(data.root, false);
      return { byK: out, live: live };
    });
    mylNames[slug].catch(function () { delete mylNames[slug]; });
    return mylNames[slug];
  }
  function renderMyl() {
    var box = $('myl');
    var slugs = lists ? Object.keys(lists).filter(function (s) { return lists[s].my; }) : [];
    box.hidden = !slugs.length;
    if (!slugs.length) return;
    var ae = document.activeElement;
    if (mylOpen && ae && box.contains(ae) && ae.tagName === 'INPUT') return;   // Suche nicht beim Tippen neu zeichnen
    if (!mylSlug || slugs.indexOf(mylSlug) < 0) {
      var d = devices[sel] || {};
      mylSlug = slugs.indexOf(d.list) >= 0 ? d.list : slugs[0];
    }
    if (mylSrcKey !== mylSlug) {
      if (mylSrc) mylSrc.close();
      mylSrcKey = mylSlug;
      mylData = {};
      mylSrc = live(mylUrl(mylSlug), function (path, data, merge) { mylData = apply(mylData, path, data, merge) || {}; renderMyl(); });
    }
    box.innerHTML = '';
    var head = document.createElement('button');
    head.className = 'head';
    head.innerHTML = '<span>' + (mylOpen ? '▾' : '▸') + '</span><span>📋 Eigene Listen (' + esc(lists[mylSlug].name || mylSlug) + ': ' + mylSorted().length + ')</span>';
    head.onclick = function () { mylOpen = !mylOpen; renderMyl(); };
    box.appendChild(head);
    if (!mylOpen) return;
    var body = document.createElement('div');
    body.className = 'body';
    if (slugs.length > 1) {
      var s = document.createElement('select');
      slugs.forEach(function (slug) {
        var o = document.createElement('option');
        o.value = slug;
        o.textContent = 'Playlist ' + (lists[slug].name || slug);
        if (slug === mylSlug) o.selected = true;
        s.appendChild(o);
      });
      s.onchange = function () { mylSlug = s.value; mylOpenId = null; renderMyl(); };
      body.appendChild(s);
    }
    var hint = document.createElement('p');
    hint.className = 'muted';
    hint.style.marginTop = '0';
    hint.textContent = 'Erscheinen sofort ganz oben auf allen Fernsehern und in der Webapp dieser Playlist.';
    body.appendChild(hint);
    var l = mylData.l || {}, ids = mylSorted();
    mylLeaves(mylSlug).then(function (info) {
      ids.forEach(function (id, idx) {
        var x = l[id], items = mylItems(x);
        var card = document.createElement('div');
        card.className = 'ml';
        var mh = document.createElement('div');
        mh.className = 'mh';
        function small(text, fn, title) {
          var b = document.createElement('button');

          order.forEach(function (oid, n) { if ((+l[oid].o || 0) !== n + 1) mylPut(oid, { n: l[oid].n, o: n + 1, i: mylItems(l[oid]) }); });
        }
        mh.appendChild(small('▲', function () { moveList(-1); }, 'nach oben'));
        mh.appendChild(small('▼', function () { moveList(1); }, 'nach unten'));
        mh.appendChild(small('✎', function () {
          var n = prompt('Neuer Name der Liste:', x.n);
          if (n && n.trim()) mylPut(id, { n: n.trim(), o: x.o || 0, i: items });
        }, 'umbenennen'));
        mh.appendChild(small('🗑', function () {
          if (confirm('Liste „' + x.n + '“ löschen? (Die Sender bleiben in ihren Gruppen.)')) mylPut(id, null);
        }, 'löschen'));
        card.appendChild(mh);
        if (mylOpenId === id) {
          items.forEach(function (k, i) {
            var it = document.createElement('div');

              if (!i) return;

            it.appendChild(small('✕', function () {

          var q = document.createElement('input');

          q.value = mylQuery;
          var res = document.createElement('div');
          function hits() {
            res.innerHTML = '';

            if (w.length < 2) return;
            info.live.filter(function (n) { return n.n.toLowerCase().indexOf(w) >= 0 && items.indexOf(n.k) < 0; })
              .slice(0, 15).forEach(function (n) {
                var b = document.createElement('button');

        }
        body.appendChild(card);
      });
      var add = document.createElement('button');

      add.onclick = function () {
        var n = prompt('Name der neuen Liste:', '⚽ Fussball');
        if (!n || !n.trim()) return;
        var id = 'l' + Date.now().toString(36);
        mylOpenId = id;
        mylPut(id, { n: n.trim(), o: ids.length + 1, i: [] });
      };
      body.appendChild(add);
    }, function () {
      body.appendChild(Object.assign(document.createElement('p'), { className: 'err', textContent: 'Senderliste konnte nicht geladen werden.' }));
    });

  }

  // ---------- Editor aus der Ferne (nur Haupt-Link): Veröffentlichen, Sender prüfen, Pushen ----------
  // Der Editor (auf einem Mac) meldet <kanal>/editor/status und holt <kanal>/editor/inbox alle 10 s ab.
  var edi = null, ediOpen = false, ediSrc = null;
  function ediOnline() { return edi && Date.now() / 1000 - (edi.t || 0) < 90; }
  function ediSend(action, arg, what) {
    return fetch(BASE + 'editor/inbox.json', {
      method: 'POST', body: JSON.stringify({ action: action, arg: arg || {}, t: Math.floor(Date.now() / 1000) })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      toast((what || 'Auftrag') + ' geschickt – der Editor übernimmt in ≤ 10 s');
    }).catch(function (e) { toast('Nicht gesendet: ' + e.message); });
  }
  function renderEdi() {
    var box = $('edi');

    var on = ediOnline(), job = (edi && edi.job) || {};

    var head = document.createElement('button');

    head.innerHTML = '<span>' + (ediOpen ? '▾' : '▸') + '</span><span>🖥 Editor: ' +
      (on ? (job.running ? '⏳ ' + esc(job.label || 'arbeitet') : '🟢 läuft auf ' + esc(edi.host || 'Mac')) : '⚪ aus') +

    head.onclick = function () { ediOpen = !ediOpen; renderEdi(); };
    box.appendChild(head);
    if (!ediOpen) return;
    var body = document.createElement('div');
    body.className = 'body';
    function line(html, cls) {
      var p = document.createElement('div');

    }
    function btns(list) {
      var row = document.createElement('div');

      });

    }
    if (!on) {
      line('Der Editor läuft gerade auf keinem Mac' + (edi && edi.t ? ' (zuletzt ' + new Date(edi.t * 1000).toLocaleString('de-DE') + ')' : '') +
        '. Aufträge gehen nur, solange er läuft: am Mac „Start-Editor.command“.');

    // App: online-Version, nicht gepushte Änderungen, Pushen
    var push = edi.push || {};
    line('📦 App online: <b>' + esc(edi.online || '?') + '</b>' +
      (edi.run && edi.run.status !== 'completed' ? ' · GitHub baut gerade App ' + esc(edi.run.number) : '') +

  // ---------- Verwaltung (nur Haupt-Link): Webapp-Links für iPhone/iPad/Mac verschicken ----------
  var admOpen = false, qrOpen = null;

    return 'Fernsehen auf iPhone, iPad oder Mac:\n' +
      '1. Diesen Link in Safari öffnen (er wird gemerkt).\n' +
      '2. iPhone/iPad: die kostenlose App „Outplayer“ oder „VLC“ aus dem App Store laden – oben neben der Uhr steht der Link. Mac: „IINA“ (iina.io).\n' +
      '3. Tipp: Teilen → „Zum Home-Bildschirm“, dann ist es wie eine App.\n\n' + webLink(slug);
  }
  function loadQr() {
    if (window.qrcode) return Promise.resolve();
    if (loadQr.p) return loadQr.p;
    loadQr.p = new Promise(function (ok, fail) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
      s.onload = ok;
      s.onerror = function () { loadQr.p = null; fail(); };
      document.head.appendChild(s);
    });
    return loadQr.p;
  }
  function renderAdm() {
    var box = $('adm');
    box.hidden = !lists;
    if (!lists) return;
    box.innerHTML = '';
    var head = document.createElement('button');
    head.className = 'head';
    head.innerHTML = '<span>' + (admOpen ? '▾' : '▸') + '</span><span>🔗 Links senden (Webapp, Handy-Fernbedienung)</span>';
    head.onclick = function () { admOpen = !admOpen; renderAdm(); };
    box.appendChild(head);
    if (!admOpen) return;
    var body = document.createElement('div');
    body.className = 'body';
    var hint = document.createElement('p');
    hint.className = 'muted';
    hint.style.marginTop = '0';
    hint.textContent = 'Der Link richtet die Webapp mit der Liste ein. Jede Liste hat nur eine Verbindung – wer die Liste mitbenutzt, teilt sie mit den Fernsehern dieser Liste.';
    body.appendChild(hint);
    Object.keys(lists).forEach(function (slug) {
      var lk = document.createElement('div');
      lk.className = 'lk';
      lk.innerHTML = '<b>Liste ' + esc(lists[slug].name || slug) + '</b>';
      var row = document.createElement('div');
      row.className = 'row2';
      function btn(text, fn) {
        var b = document.createElement('button');
        b.textContent = text;
        b.onclick = fn;
        row.appendChild(b);
      }
      if (navigator.share) btn('📤 Teilen', function () {
        navigator.share({ title: 'Fernsehen – Liste ' + (lists[slug].name || slug), text: shareText(slug) }).catch(function () { /* abgebrochen */ });
      });
      btn('📋 Link kopieren', function () {
        (navigator.clipboard ? navigator.clipboard.writeText(webLink(slug)) : Promise.reject())
          .then(function () { toast('Link kopiert ✓'); }, function () { prompt('Link kopieren:', webLink(slug)); });
      });
      btn(qrOpen === slug ? '✕ QR' : '▦ QR-Code', function () { qrOpen = qrOpen === slug ? null : slug; renderAdm(); });
      lk.appendChild(row);
      if (qrOpen === slug) {
        var qr = document.createElement('div');
        qr.className = 'qr';
        qr.textContent = 'QR wird erstellt …';
        lk.appendChild(qr);
        loadQr().then(function () {
          var q = window.qrcode(0, 'M');
          q.addData(webLink(slug));
          q.make();
          qr.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
        }, function () { qr.textContent = 'QR-Code konnte nicht geladen werden.'; });
      }
      body.appendChild(lk);
    });
    // 📱 Handy-Fernbedienung je Fernseher (Geräte-Link: nur Bedienen, keine Einstellungen; ab App 72)
    var phones = Object.keys(devices).filter(function (id) { return devices[id].cfg && devices[id].cfg.phone; })
      .sort(function (a, b) { return label(a).localeCompare(label(b)); });
    var ph = document.createElement('p');
    ph.className = 'muted';
    ph.innerHTML = '<b>📱 Handy-Fernbedienung je Fernseher</b> – nur Bedienen (Sender, Ein/Aus, Erinnerungen), keine Einstellungen.' +
      (phones.length ? '' : ' Erscheint, sobald ein Stick App 72 oder neuer hat.');
    body.appendChild(ph);
    phones.forEach(function (id) {
      var link = devices[id].cfg.phone, key = 'ph:' + id;
      var lk = document.createElement('div');
      lk.className = 'lk';
      lk.innerHTML = '<b>' + esc(label(id)) + '</b>';
      var row = document.createElement('div');
      row.className = 'row2';
      function btn(text, fn) { var b = document.createElement('button'); b.textContent = text; b.onclick = fn; row.appendChild(b); }
      if (navigator.share) btn('📤 Teilen', function () {
        navigator.share({ title: 'Fernbedienung ' + label(id), text: 'Fernbedienung für den Fernseher „' + label(id) +
          '“ – Link am Handy öffnen, am besten „Zum Home-Bildschirm“:\n' + link }).catch(function () {});
      });
      btn('📋 Link kopieren', function () {
        (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
          .then(function () { toast('Link kopiert ✓'); }, function () { prompt('Link kopieren:', link); });
      });
      btn(qrOpen === key ? '✕ QR' : '▦ QR-Code', function () { qrOpen = qrOpen === key ? null : key; renderAdm(); });
      lk.appendChild(row);
      if (qrOpen === key) {
        var qr = document.createElement('div');
        qr.className = 'qr';
        qr.textContent = 'QR wird erstellt …';
        lk.appendChild(qr);
        loadQr().then(function () {
          var q = window.qrcode(0, 'M');
          q.addData(link);
          q.make();
          qr.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
        }, function () { qr.textContent = 'QR-Code konnte nicht geladen werden.'; });
      }
      body.appendChild(lk);
    });
    box.appendChild(body);
  }

  // ---------- Erinnerungen (🔔 beim Sender → Programm → Sendung antippen; der Stick meldet „rem“) ----------
  var bellOpen = null;   // Sender (norm), dessen Programm aufgeklappt ist
  function remOf(d) {
    var r = d && d.rem;
    if (!r) return [];
    return Array.isArray(r) ? r : Object.keys(r).map(function (k) { return r[k]; });
  }
  function isRem(d, norm, t) {
    return remOf(d).some(function (r) { return r.norm === norm && +r.t === +t; });
  }
  function when(sec) {
    var d = new Date(sec * 1000), today = new Date();
    var day = d.toDateString() === today.toDateString() ? '' : ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()] + ' ';
    return day + hhmm(sec);
  }
  function remind(norm, ch, p, on) {
    send('remind', { norm: norm, ch: ch, t: p[0], title: p[2], on: on }, true);
    toast(on ? '🔔 Erinnerung: ' + when(p[0]) + ' „' + p[2] + '“' : 'Erinnerung gelöscht');
  }
  // Gerade Aufgeklapptes ganz zeigen: ragt es unter die Leiste unten, so weit hochschieben, dass es darüber steht
  // (oben bleibt der Kopf sichtbar). Nur direkt nach dem Antippen, nicht bei jedem Neuzeichnen.
  var revealKey = null;
  function reveal(el) {
    setTimeout(function () {   // nach dem Zeichnen messen
      if (!el || !el.isConnected) return;
      var r = el.getBoundingClientRect();
      var bar = document.body.classList.contains('hasq') ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--qbh'), 10) || 74) + 12 : 12;
      var over = r.bottom - (innerHeight - bar);
      if (r.top < 60) window.scrollBy({ top: r.top - 70, behavior: 'smooth' });   // Kopf oben verschwunden: zurückholen
      else if (over > 1) window.scrollBy({ top: Math.min(over, r.top - 70), behavior: 'smooth' });
    }, 30);
  }
  // Zeile eines Senders: antippen = umschalten, 🔔 = Programm zum Erinnern auf-/zuklappen
  function channelRow(o) {
    var d = devices[sel] || {};
    var wrap = document.createElement('div');
    if (o.depth) wrap.style.marginLeft = o.depth * 14 + 'px';
    var row = document.createElement('div');
    row.className = 'row';
    var b = document.createElement('button');
    b.className = 'main' + (o.norm === d.norm ? ' cur' : '');
    b.innerHTML = (o.logo ? '<img alt="" loading="lazy" src="' + esc(o.logo.replace(/^http:/, 'https:')) + '" onerror="this.style.display=\'none\'">' : '') +
      '<span><span class="t">' + esc(o.name) + '</span>' + (o.sub ? '<span class="s">' + esc(o.sub) + '</span>' : '') + '</span>';
    b.onclick = function () { send('play', { norm: o.norm }); toast('Startet auf dem Fernseher: ' + o.name); };
    row.appendChild(b);
    var progs = (o.progs || []).filter(function (p) { return p[1] > Date.now() / 1000; });
    if (progs.length) {
      var has = progs.some(function (p) { return isRem(d, o.norm, p[0]); });
      var bell = document.createElement('button');
      bell.className = 'bell' + (bellOpen === o.norm ? ' open' : '') + (has ? ' set' : '');
      bell.textContent = '🔔';
      bell.title = 'An eine Sendung erinnern';
      bell.onclick = function () {   // nur diese Zeile auf-/zuklappen (nicht die ganze Liste neu zeichnen)
        var open = bellOpen !== o.norm;
        bellOpen = open ? o.norm : null;
        document.querySelectorAll('.bell.open').forEach(function (x) {
          x.classList.remove('open');
          var pb = x.closest('.row') && x.closest('.row').nextElementSibling;
          if (pb && pb.className === 'prog') pb.remove();
        });
        if (!open) return;
        bell.classList.add('open');
        wrap.appendChild(progBox());
        reveal(wrap);
      };
      row.appendChild(bell);
    }
    wrap.appendChild(row);
    function progBox() {
      var box = document.createElement('div');
      box.className = 'prog';
      var hint = document.createElement('p');
      hint.className = 'muted';
      hint.textContent = 'Sendung antippen: Eine Minute vorher erscheint am Fernseher „Gleich beginnt … Umschalten“.';
      box.appendChild(hint);
      progs.slice(0, 12).forEach(function (p, i) {
        var on = isRem(d, o.norm, p[0]);
        var pb = document.createElement('button');
        if (on) pb.className = 'on';
        var running = i === 0 && p[0] <= Date.now() / 1000;
        pb.innerHTML = '<span class="tm">' + (running ? 'läuft' : esc(when(p[0]))) + '</span><span>' + (on ? '🔔 ' : '') + esc(p[2]) + '</span>';
        if (running) pb.disabled = true;
        else pb.onclick = function () { remind(o.norm, o.name, p, !on); };
        box.appendChild(pb);
      });
      return box;
    }
    if (bellOpen === o.norm && progs.length) wrap.appendChild(progBox());   // offen geblieben beim Neuzeichnen
    return wrap;
  }
  function renderRems(d) {
    var box = $('rems');
    box.innerHTML = '';
    var r = remOf(d).slice().sort(function (a, b) { return a.t - b.t; });
    secSum('rems', r.length ? r.length + '' : '');
    if (!r.length) return;
    r.forEach(function (x) {
      var b = document.createElement('button');
      b.innerHTML = '<span><span class="t">' + esc(when(x.t)) + '  ' + esc(x.title) + '</span><span class="s">' + esc(x.ch) + '</span></span><span class="x">✕ löschen</span>';
      b.onclick = function () { remind(x.norm, x.ch, [x.t, 0, x.title], false); };
      box.appendChild(b);
    });
  }

  function renderList() {
    var d = devices[sel] || {};
    var c = channels && channels.items ? channels : null;
    if (listSource(d)) c = null;   // „Alles auf diesem Fernseher“ (Reiter, Gruppen, Suche) reicht
    $('lhead').hidden = !c;
    $('list').innerHTML = '';
    if (!c) return;
    $('lhead').textContent = c.group || 'Sender';
    secTitle('list', '📺 ' + (c.group || 'Sender'));
    secSum('list', c.items.length + '');
    c.items.forEach(function (it) {
      $('list').appendChild(channelRow({ norm: it.k, name: it.n, sub: it.now, logo: it.l, progs: it.p, redraw: renderList }));
    });
  }

  function sendTo(dev, action, arg) {
    return fetch(BASE + 'inbox/' + encodeURIComponent(dev) + '.json', {
      method: 'POST',
      body: JSON.stringify({ action: action, arg: arg || {}, t: Math.floor(Date.now() / 1000) })
    }).catch(function () { /* egal */ });
  }

  function send(action, arg, quiet) {
    if (!sel) return;
    return fetch(BASE + 'inbox/' + encodeURIComponent(sel) + '.json', {
      method: 'POST',
      body: JSON.stringify({ action: action, arg: arg || {}, t: Math.floor(Date.now() / 1000) })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (!quiet) toast('Gesendet ✓');
    }).catch(function (e) { if (!quiet) toast('Nicht gesendet: ' + e.message); });
  }

  document.querySelectorAll('#remote [data-a]').forEach(function (b) {
    b.onclick = function () {
      var a = b.getAttribute('data-a');
      if (a === 'message') {
        var text = prompt('Nachricht für den Fernseher:');
        if (text) send('message', { text: text });
        return;
      }
      if (a === 'update' && !confirm('Neue App-Version laden und installieren?')) return;
      if (a === 'sleep' && !confirm('Fernseher/Stick ausschalten (Standby)?')) return;
      if (a === 'restart' && !confirm('App auf diesem Fernseher neu starten? (Liste wird frisch geladen)')) return;
      send(a, a === 'zap' ? { d: +b.getAttribute('data-d') } : {});
    };
  });
  // Livebild (nur Haupt-Link): Stick schickt ~alle 1,5 s ein kleines Standbild, solange es angefordert wird (60 s,
  // die Seite fragt alle 40 s nach). Aus beim Zuklappen, beim Gerätewechsel und wenn die Seite im Hintergrund ist.
  var liveOn = false, liveSrc = null, liveDev = null, liveTimer = null, liveT = 0;
  // Livebild gehört zum Steuerkreuz: läuft, solange es aufgeklappt ist (nur Haupt-Link)
  function updLive() {
    var d = devices[sel] || {};
    var want = liveWanted && !!d.cfg && !document.hidden;
    $('live').hidden = !want;
    if (want === liveOn && (!want || liveDev === sel)) return;
    liveOn = want;
    liveT = 0;
    if (want) liveStart(); else liveStop();
  }
  function liveStop() {
    if (liveSrc) liveSrc.close();
    liveSrc = null;
    clearInterval(liveTimer);
    if (liveDev) sendTo(liveDev, 'shot', { on: false });
    liveDev = null;
  }
  function liveStart() {
    liveStop();
    if (!liveOn || !sel || document.hidden) return;
    liveDev = sel;
    $('liveinfo').textContent = 'Warte auf das erste Bild …';
    sendTo(liveDev, 'shot', { on: true });
    liveTimer = setInterval(function () { if (liveDev) sendTo(liveDev, 'shot', { on: true }); }, 40000);
    var shot = null;
    liveSrc = live(BASE + 'shot/' + encodeURIComponent(liveDev) + '.json', function (path, data, merge) {
      shot = apply(shot || {}, path, data, merge);
      if (shot && shot.img && shot.t > liveT - 1) {
        liveT = shot.t;
        $('liveimg').src = 'data:image/jpeg;base64,' + shot.img;
      }
    });
  }
  setInterval(function () {   // Alter des Bildes anzeigen
    if (!liveOn || !liveT) return;
    var s = Math.round((Date.now() - liveT) / 1000);
    $('liveinfo').textContent = s < 5 ? 'live (Standbild alle 1–2 s, ohne Ton)' : 'Bild von vor ' + s + ' s'
      + (s > 15 ? ' – ist „Fernsehen“ am Fernseher vorne?' : '');
  }, 1000);
  document.addEventListener('visibilitychange', updLive);

  // Tasten wie auf der Fire-TV-Fernbedienung (Fernwartung „key“)
  document.querySelectorAll('#remote [data-k], #qbar [data-k]').forEach(function (b) {
    b.onclick = function () {
      if (navigator.vibrate) navigator.vibrate(15);
      send('key', { k: b.getAttribute('data-k') }, true);
    };
  });
  // 📷 Livebild an/aus (gemerkt; nur Haupt-Link)
  var liveWanted = false;
  try { liveWanted = localStorage.getItem(KEY + '-livebild') === '1'; } catch (e) { /* egal */ }
  $('livebtn').onclick = function () {
    liveWanted = !liveWanted;
    try { localStorage.setItem(KEY + '-livebild', liveWanted ? '1' : '0'); } catch (e) { /* egal */ }
    render();
  };
  // ⏻ Ein/Aus: im Standby oder bei geschlossener App „Einschalten“, sonst mit Wächter „Ausschalten“
  $('power').onclick = function () {
    var d = devices[sel] || {};
    var off = d.screen === false || d.state === 'closed';
    if (off || !(d.cfg && d.cfg.waechter)) { send('wake', {}); return; }
    if (confirm('Fernseher/Stick ausschalten (Standby)?')) send('sleep', {});
  };

  // Kurzleiste unten nur, wenn die große Fernbedienung da ist, aber gerade nicht im Bild (oder zugeklappt)
  var padSeen = true;
  function updQbar() {
    var r = $('remote'), shut = secs.remote && secs.remote.wrap.classList.contains('shut');
    var show = !r.hidden && (shut || !padSeen);
    $('qbar').hidden = !show;
    document.body.classList.toggle('hasq', !r.hidden);
    document.documentElement.classList.toggle('hasq', !r.hidden);
    var h = $('qbar').offsetHeight;   // echte Höhe (mit Rand unten am iPhone)
    if (h) document.documentElement.style.setProperty('--qbh', h + 'px');
  }
  window.addEventListener('resize', updQbar);
  // Beim Tippen in ein Feld (Suche, Nachricht, Zeitplan) die Leiste ausblenden und das Feld über ihr halten
  var isField = function (el) { return el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) && el.type !== 'checkbox'; };
  document.addEventListener('focusin', function (ev) {
    if (!isField(ev.target)) return;
    document.body.classList.add('typing');
  });
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (!isField(document.activeElement)) document.body.classList.remove('typing'); }, 50);
  });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { padSeen = es[0].isIntersecting; updQbar(); })
      .observe(document.querySelector('#remote .dpad'));
  }
  new MutationObserver(updQbar).observe($('remote'), { attributes: true, attributeFilter: ['hidden'] });
  if (secs.remote) new MutationObserver(updQbar).observe(secs.remote.wrap, { attributes: true, attributeFilter: ['class'] });
  updQbar();

  // Laufende Sendung (Fortschritt) jede Minute neu zeichnen
  setInterval(render, 60000);
})();
</script>
</body>
</html>
