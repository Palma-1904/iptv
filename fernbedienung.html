<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fernbedienung</title>
<style>
  :root {
    --bg: #0b1220; --panel: #151f33; --panel2: #1d2a44; --text: #f1f5ff; --muted: #a9b6cf;
    --accent: #3b6cf6; --ok: #34c77b; --warn: #f0b429; --bad: #ef5350;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef2f8; --panel: #ffffff; --panel2: #e3e9f4; --text: #13203a; --muted: #5b6b86;
      --accent: #1d4ed8; --ok: #15803d; --warn: #b45309; --bad: #c62828;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .card { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 15px; }
  .now { font-size: 21px; font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .prog { font-size: 16px; margin-top: 8px; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin: 6px 0 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 0; border-radius: 12px;
    padding: 14px 8px; min-height: 56px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(.97); background: var(--accent); }
  button.big { font-size: 24px; }
  button.wide { grid-column: span 3; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
  .tabs button { min-height: 44px; padding: 8px 14px; white-space: nowrap; flex: none; }
  .tabs button.sel { background: var(--accent); color: #fff; }
  .list button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 10px 12px; min-height: 60px; background: var(--panel); }
  .list button.cur { outline: 2px solid var(--accent); }
  .list img { width: 48px; height: 32px; object-fit: contain; flex: none; }
  .list .t { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .list .s { display: block; color: var(--muted); font-size: 14px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 608px;
    margin: 0 auto; background: var(--accent); color: #fff; padding: 12px 14px; border-radius: 12px;
    opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .err { color: var(--bad); }
  #warn { background: var(--panel); border-left: 4px solid var(--warn); border-radius: 12px; padding: 10px 14px;
    margin-bottom: 12px; font-size: 15px; }
  #warn div { margin: 3px 0; }
  .memo { font-size: 15px; color: var(--muted); margin: -6px 0 10px; }
  #cfg .seg { display: flex; gap: 8px; margin-bottom: 8px; }
  #cfg .seg button { flex: 1; min-height: 46px; }
  #cfg .seg button.sel { background: var(--accent); color: #fff; }
  #cfg select { width: 100%; font: inherit; padding: 12px; border-radius: 12px; border: 0; background: var(--panel2);
    color: var(--text); margin-bottom: 8px; }
  .list .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .list .row > button { margin-bottom: 0; }
  .list .row > button.main { flex: 1; width: auto; min-width: 0; }
  .list .row > button.bell { flex: none; width: 56px; justify-content: center; padding: 0; font-size: 20px; }
  .list .row > button.bell { opacity: .45; }
  .list .row > button.bell.set, .list .row > button.bell.open { opacity: 1; }
  .list .row > button.bell.open { background: var(--accent); }
  .list .prog { margin: 0 0 10px 16px; }
  .list .prog button { min-height: 46px; font-size: 15px; padding: 8px 12px; margin-bottom: 6px; }
  .list .prog button.on { outline: 2px solid var(--warn); }
  .list .prog .tm { flex: none; width: 74px; color: var(--muted); }
  #rems .x { margin-left: auto; color: var(--muted); flex: none; }
  #live { grid-column: span 3; }
  #liveimg { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 8px; display: block; }
  #live p { margin: 6px 0 0; }
  #dpadbox { padding: 0; }
  #dpadbox > button.head { width: 100%; background: none; text-align: left; display: flex; gap: 8px; min-height: 52px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 14px 14px; }
  .dpad button { min-height: 64px; font-size: 20px; }
  .dpad button.big { font-size: 26px; }
  .dpad button.ok { background: var(--accent); color: #fff; font-weight: 700; border-radius: 50%; aspect-ratio: 1;
    min-height: 0; width: 76px; justify-self: center; }
  .dpad .wide { grid-column: span 3; margin: 0; }
  #cfg { padding: 0; }
  #cfg > button.head { width: 100%; background: none; text-align: left; display: flex; gap: 8px; min-height: 52px; }
  #cfg .body { padding: 0 14px 14px; }
  #cfg .sw { display: flex; width: 100%; justify-content: space-between; margin-bottom: 8px; min-height: 50px;
    padding: 10px 14px; text-align: left; }
  #cfg .sw b { color: var(--muted); font-weight: 600; }
  #cfg .sw.on b { color: var(--ok); }
  #cfg .chk { margin: 4px 0; font-size: 15px; }
  #cfg .chk.no { color: var(--bad); }
  #cfg .chk.yes { color: var(--ok); }
  .ver { margin-top: 8px; font-size: 15px; color: var(--muted); }
  .ver b { color: var(--text); }
  .ver.old { color: var(--warn); }
  button.hot { background: var(--warn); color: #1b1300; }
  h2 { font-size: 17px; margin: 18px 0 8px; }
  .list button.dir { background: var(--panel2); min-height: 52px; }
  .list button.dir.open { background: var(--accent); color: #fff; position: sticky; top: 0; z-index: 1; }
  .list button.dir.open .c { color: #e6ecff; }
  .list .arrow { width: 16px; flex: none; }
  .list .c { margin-left: auto; color: var(--muted); font-size: 14px; flex: none; }
  input[type=search] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 0;
    background: var(--panel); color: var(--text); margin-bottom: 10px; }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span><span id="devname">Fernbedienung</span></h1>
<div id="warn" hidden></div>
<div class="tabs" id="tabs" hidden></div>
<div class="card" id="state"><span class="muted">Verbinde …</span></div>
<div class="pad" id="pad" hidden>
  <button class="big" data-a="zap" data-d="-1" aria-label="Vorheriger Sender">▲</button>
  <button class="big" data-a="toggle" aria-label="Pause oder weiter">⏯</button>
  <button class="big" data-a="stop" aria-label="Stoppen">⏹</button>
  <button class="big" data-a="zap" data-d="1" aria-label="Nächster Sender">▼</button>
  <button data-a="message">💬 Nachricht</button>
  <button data-a="reload">↻ Neu laden</button>
  <button class="wide" data-a="wake" id="wake" hidden>⏻ Einschalten / App öffnen</button>
  <button class="wide" data-a="restart" id="restart" hidden>⟳ App neu starten</button>
  <button class="wide" data-a="update" id="upd" hidden>App aktualisieren</button>
</div>
<div class="card" id="dpadbox" hidden>
  <button class="head" id="dpadhead"><span id="dpadarrow">▸</span><span>🎮 Steuerkreuz (wie die Fernbedienung)</span></button>
  <div class="dpad" id="dpad" hidden>
    <div id="live" hidden>
      <img id="liveimg" alt="Bild vom Fernseher">
      <p class="muted" id="liveinfo">Warte auf das erste Bild …</p>
    </div>
    <button data-k="menu" aria-label="Menü">☰</button>
    <button data-k="up" class="big" aria-label="Hoch">▲</button>
    <button data-k="playpause" aria-label="Play/Pause">⏯</button>
    <button data-k="left" class="big" aria-label="Links">◀</button>
    <button data-k="ok" class="ok" aria-label="OK">OK</button>
    <button data-k="right" class="big" aria-label="Rechts">▶</button>
    <button data-k="back" aria-label="Zurück">↩</button>
    <button data-k="down" class="big" aria-label="Runter">▼</button>
    <span></span>
    <button data-k="rew" aria-label="Zurückspulen">⏪</button>
    <span></span>
    <button data-k="ff" aria-label="Vorspulen">⏩</button>
    <p class="muted wide">Wirkt nur in „Fernsehen“ (nicht im Fire-TV-Menü). Jeder Druck braucht etwa eine Sekunde.</p>
  </div>
</div>
<div class="card" id="cfg" hidden></div>
<div class="list" id="rems"></div>
<h2 id="lhead" hidden></h2>
<div class="list" id="list"></div>
<section id="all" hidden>
  <h2>Alles auf diesem Fernseher</h2>
  <input type="search" id="q" placeholder="Sender, Film oder Serie suchen …" hidden>
  <div class="list" id="tree"></div>
</section>
<p class="muted" id="foot"></p>
<div class="toast" id="toast"></div>
<script>
  // tree.js (derselbe Baum wie in der App) braucht nur IPTV.nativeLeaf: hier ohne Adresse, nur Kennung (norm)
  window.IPTV = {
    nativeLeaf: function (e, label, title) {
      var o = { n: label || e.name, k: e.norm, t: e.type };
      if (title && title !== o.n) o.ti = title;
      if (e.tvgId) o.id = e.tvgId;
      if (e.logo) o.l = e.logo;
      return o;
    }
  };
</script>
<script src="js/tree.js"></script>
<script>
(function () {
  'use strict';
  // Link aus dem QR-Code: #k=<geheimer Schlüssel>&db=<Firebase-Datenbank>; wird im Handy gemerkt
  var KEY = 'iptv-fernbedienung';
  var p = new URLSearchParams(location.hash.slice(1));
  var cfg = { k: p.get('k'), db: p.get('db') };
  try {
    if (cfg.k && cfg.db) localStorage.setItem(KEY, JSON.stringify(cfg));
    else cfg = JSON.parse(localStorage.getItem(KEY) || '{}');
  } catch (e) { /* privater Modus */ }
  var $ = function (id) { return document.getElementById(id); };
  if (!/^[A-Za-z0-9_-]{24,64}$/.test(cfg.k || '') ||
      !/^[a-z0-9-]+(\.[a-z0-9-]+)?\.(firebasedatabase\.app|firebaseio\.com)$/.test(cfg.db || '')) {
    $('state').innerHTML = '<span class="err">Kein gültiger Link. Bitte den QR-Code am Fernseher scannen ' +
      '(☰ 3 Sekunden halten → Weitere Einstellungen → Handy-Fernbedienung).</span>';
    return;
  }
  var BASE = 'https://' + cfg.db + '/' + cfg.k + '/';
  var devices = {}, channels = null, sel = null, chSrc = null;
  try { sel = localStorage.getItem(KEY + '-gerät'); } catch (e) { /* egal */ }

  function toast(t) {
    var el = $('toast');
    el.textContent = t;
    el.classList.add('show');
    clearTimeout(toast.h);
    toast.h = setTimeout(function () { el.classList.remove('show'); }, 3500);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function hhmm(sec) {
    var d = new Date(sec * 1000);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  var STATE = { playing: '▶ läuft', paused: '⏸ angehalten', stopped: '⏹ gestoppt', error: '⚠ Fehler',
    sleep: '💤 Schlaf-Timer', overview: '☰ in der Übersicht', tvoff: '📺 Fernseher aus', start: 'startet',
    closed: '⏻ App geschlossen' };

  // Admin: eigene Gerätenamen/Notizen und Abo-Ablauf (legt der Editor ab), alle 5 Minuten neu
  var notes = {}, accounts = {};
  function loadMeta() {
    ['notes', 'accounts'].forEach(function (key) {
      fetch(BASE + key + '.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
        if (key === 'notes') notes = v || {}; else accounts = v || {};
        render();
      }).catch(function () { /* egal */ });
    });
  }
  loadMeta();
  setInterval(loadMeta, 5 * 60 * 1000);
  function label(id) {
    var n = notes[id], d = devices[id] || {};
    return n && n.label ? n.label : d.name || 'Gerät';
  }

  // Warnungen über alle Sticks: offline, schwaches WLAN, Update verfügbar, Abo läuft ab
  function renderWarn(ids) {
    var w = [], now = Date.now() / 1000;
    ids.forEach(function (id) {
      var d = devices[id], age = now - (d.t || 0);
      if (age > 30 * 60) w.push('📴 ' + esc(label(id)) + ': seit ' + (age < 5400 ? Math.round(age / 60) + ' Min.' : age < 172800 ? Math.round(age / 3600) + ' Std.' : Math.round(age / 86400) + ' Tagen') + ' keine Meldung');
      var r = d.diag && d.diag.rssi;
      if (age <= 30 * 60 && r !== undefined && r < -72) w.push('📶 ' + esc(label(id)) + ': WLAN schwach (' + r + ' dBm)');
      if (d.cfg && latest && d.ver && d.ver < latest) w.push('⬆️ ' + esc(label(id)) + ': App ' + d.ver + ', neu ist ' + latest);
      if (d.cfg && !d.cfg.install) w.push('⚠️ ' + esc(label(id)) + ': Updates nicht erlaubt');
    });
    Object.keys(accounts).forEach(function (k) {
      var a = accounts[k], days = Math.round((a.expires - now) / 86400);
      var date = new Date(a.expires * 1000).toLocaleDateString('de-DE');
      if (days < 0) w.push('❌ Zugang ' + esc(a.name) + ' ist seit ' + date + ' abgelaufen');
      else if (days <= 30) w.push('⏳ Zugang ' + esc(a.name) + ' läuft am ' + date + ' ab (in ' + days + ' Tagen)');
    });
    $('warn').hidden = !w.length;
    $('warn').innerHTML = w.map(function (x) { return '<div>' + x + '</div>'; }).join('');
  }

  // Firebase-Live-Verbindung (Server-Sent Events): put/patch mit Pfad relativ zum Abo
  function live(url, onData) {
    var es = new EventSource(url);
    function handle(ev, merge) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      onData(m.path, m.data, merge);
    }
    es.addEventListener('put', function (ev) { handle(ev, false); });
    es.addEventListener('patch', function (ev) { handle(ev, true); });
    es.onerror = function () { $('foot').textContent = 'Verbindung unterbrochen – verbinde neu …'; };
    es.onopen = function () { $('foot').textContent = ''; };
    return es;
  }
  function apply(obj, path, data, merge) {
    var parts = path.split('/').filter(Boolean);
    if (!parts.length) {
      if (merge) { for (var k in data) obj[k] = data[k]; return obj; }
      return data || {};
    }
    var o = obj;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
    var last = parts[parts.length - 1];
    if (data === null) delete o[last];
    else if (merge && o[last]) for (var j in data) o[last][j] = data[j];
    else o[last] = data;
    return obj;
  }

  // Neueste veröffentlichte App-Version (liegt neben dieser Seite), alle 10 Minuten neu
  var latest = 0;
  function loadLatest() {
    fetch('app-version.txt?t=' + Date.now()).then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { var v = parseInt(t, 10); if (v > 0 && v !== latest) { latest = v; render(); } })
      .catch(function () { /* offline */ });
  }
  loadLatest();
  setInterval(loadLatest, 10 * 60 * 1000);

  live(BASE + 'status.json', function (path, data, merge) {
    devices = apply(devices, path, data, merge);
    render();
  });

  function choose(id) {
    if (id === sel && chSrc) return;
    sel = id;
    try { localStorage.setItem(KEY + '-gerät', id); } catch (e) { /* egal */ }
    if (chSrc) chSrc.close();
    channels = null;
    chSrc = live(BASE + 'sender/' + encodeURIComponent(id) + '.json', function (path, data, merge) {
      channels = apply(channels || {}, path, data, merge);
      renderList();
    });
    send('watch', {}, true);   // Gerät meldet sich gleich mit frischem Stand
    render();
  }

  function render() {
    var ids = Object.keys(devices).filter(function (k) { return devices[k] && devices[k].name; });
    ids.sort(function (a, b) { return label(a).localeCompare(label(b)); });
    renderWarn(ids);
    if (!ids.length) {
      $('state').innerHTML = '<span class="muted">Noch keine Meldung vom Fernseher. Ist der Stick an und die App geöffnet?</span>';
      return;
    }
    if (ids.indexOf(sel) < 0) return choose(ids[0]);
    var tabs = $('tabs');
    tabs.hidden = ids.length < 2;
    tabs.innerHTML = '';
    ids.forEach(function (id) {
      var b = document.createElement('button');
      b.textContent = label(id);
      if (id === sel) b.className = 'sel';
      b.onclick = function () { choose(id); };
      tabs.appendChild(b);
    });
    var d = devices[sel];
    var age = Date.now() / 1000 - (d.t || 0);
    $('dot').className = 'dot' + (age < 12 * 60 ? ' on' : '');
    $('devname').textContent = label(sel);
    var memo = notes[sel] && notes[sel].note;
    var standby = d.screen === false;
    var h = (memo ? '<div class="memo">📝 ' + esc(memo) + '</div>' : '') +
      '<div class="muted">' + (standby ? '💤 Stick im Standby · ' : '') + esc(STATE[d.state] || d.state || '') +
      (age > 12 * 60 ? ' · zuletzt gemeldet vor ' + Math.round(age / 60) + ' min' : '') + '</div>';
    if (d.title) h += '<div class="now">' + esc(d.title) + '</div>';
    var epg = d.epg || [];
    var t = Date.now() / 1000;
    if (epg[0] && d.state === 'playing') {
      var pc = Math.max(0, Math.min(100, (t - epg[0][0]) / (epg[0][1] - epg[0][0]) * 100));
      h += '<div class="prog">' + hhmm(epg[0][0]) + '–' + hhmm(epg[0][1]) + '  ' + esc(epg[0][2]) + '</div>' +
        '<div class="bar"><i style="width:' + pc.toFixed(0) + '%"></i></div>';
      if (epg[1]) h += '<div class="muted">danach ' + hhmm(epg[1][0]) + '  ' + esc(epg[1][2]) + '</div>';
    }
    if (d.note && d.noteT && t - d.noteT < 120) h += '<div class="muted">↩ ' + esc(d.note) + '</div>';
    if (d.cfg && d.ver) {   // Admin: App-Stand des Sticks und neueste Version
      var old = latest && d.ver < latest;
      h += '<div class="ver' + (old ? ' old' : '') + '">App auf dem Stick: <b>' + esc(d.ver) + '</b>' +
        (latest ? ' · neueste: <b>' + latest + '</b>' + (old ? ' – Update verfügbar' : ' ✓ aktuell') : '') + '</div>';
    }
    $('state').innerHTML = h;
    $('pad').hidden = false;
    $('dpadbox').hidden = false;
    updLive();
    $('upd').hidden = !d.cfg;   // nur mit dem Haupt-Link aus dem Editor
    $('wake').hidden = $('restart').hidden = !d.cfg;
    $('wake').classList.toggle('hot', !!(d.cfg && (standby || d.state === 'closed')));
    $('upd').textContent = latest && d.ver < latest ? 'App aktualisieren auf Version ' + latest : 'App aktualisieren';
    $('upd').classList.toggle('hot', !!(latest && d.ver < latest));
    renderCfg(d);
    renderRems(d);
    renderList();
    adminFor(d);
  }

  // ---------- Admin (nur Haupt-Link): ganze Liste des Sticks – Live TV, Filme, Serien, Suche ----------
  // Der Editor legt unter <kanal>/lists die Einrichtungs-Links ab; die Handy-Codes einzelner Sticks haben keine.
  var lists = null, trees = {}, nav = [], shownList = null, query = '';
  fetch(BASE + 'lists.json').then(function (r) { return r.ok ? r.json() : null; })
    .then(function (l) { lists = l; if (sel && devices[sel]) { renderList(); adminFor(devices[sel]); } })
    .catch(function () { /* keine Admin-Ansicht */ });

  function norm(u) { return u.replace(/^https?:\/\/[^\/]+\/(live|movie|series)\/[^\/]+\/[^\/]+\//, '$1/'); }
  function parseM3u(text) {
    var out = [], cur = null, lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line.indexOf('#EXTINF') === 0) {
        var q = false, c = -1;
        for (var j = 0; j < line.length; j++) {
          if (line[j] === '"') q = !q;
          else if (line[j] === ',' && !q) { c = j; break; }
        }
        var head = c >= 0 ? line.slice(0, c) : line, a = {}, m, re = /([\w-]+)="([^"]*)"/g;
        while ((m = re.exec(head))) a[m[1].toLowerCase()] = m[2].trim();
        cur = { name: (c >= 0 ? line.slice(c + 1).trim() : '') || a['tvg-name'] || 'Unbenannt',
          group: a['group-title'] || 'Sonstige', logo: a['tvg-logo'] || '', tvgId: a['tvg-id'] || '',
          work: a['x-work'] || '', lang: (a['x-lang'] || '').toUpperCase(),
          type: /^(live|movie|series)$/.test(a['tvg-type']) ? a['tvg-type'] : 'live' };
      } else if (line && line[0] !== '#' && /^https?:\/\//i.test(line)) {
        var e = cur || { name: line, group: 'Sonstige', logo: '', tvgId: '', work: '', lang: '', type: 'live' };
        if (e.type === 'series') e.name = e.name.replace(/\b(S\d{1,3}) (E\d{1,4})\b/, '$1$2');
        e.norm = norm(line);
        out.push(e);
        cur = null;
      }
    }
    return out;
  }
  function loadList(slug) {
    if (trees[slug]) return trees[slug];
    var info = lists[slug], p = info.link.split('/');
    var base = 'https://gist.githubusercontent.com/' + p[0] + '/' + p[1] + '/raw/' + (info.rev ? info.rev + '/' : '');
    var fresh = info.rev ? '' : '?t=' + Date.now();
    trees[slug] = Promise.all([
      fetch(base + p[2] + '.m3u' + fresh).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }),
      fetch(base + p[2] + '.epg.json' + fresh).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]).then(function (res) {
      return { root: IPTV.buildTree(parseM3u(res[0])).root, epg: res[1] && res[1].channels ? res[1].channels : {} };
    });
    trees[slug].catch(function () { delete trees[slug]; });
    return trees[slug];
  }

  function adminFor(d) {
    if (!lists || !d.list || !lists[d.list]) { $('all').hidden = true; return; }
    $('all').hidden = false;
    if (shownList !== d.list) {
      shownList = d.list;
      nav = [];
      query = '';
      $('tree').innerHTML = '<p class="muted">Lade Liste „' + esc(lists[d.list].name) + '“ …</p>';
      loadList(d.list).then(function () { drawTree(); }, function (e) {
        $('tree').innerHTML = '<p class="err">Liste nicht ladbar: ' + esc(e.message) + '</p>';
      });
    } else if (d.norm !== adminFor.norm || JSON.stringify(d.rem || null) !== adminFor.rem) {
      drawTree();   // anderer Sender läuft / Erinnerungen geändert: neu zeichnen
    }
    adminFor.norm = d.norm;
    adminFor.rem = JSON.stringify(d.rem || null);
  }

  function nowTitle(epg, id) {
    var p = id && epg[id], t = Date.now() / 1000;
    if (!p) return '';
    for (var i = 0; i < p.length; i++) if (p[i][0] <= t && p[i][1] > t) return p[i][2];
    return '';
  }
  function countLeaves(n) {
    if (!n.c) return n.s ? 0 : 1;
    var k = 0;
    n.c.forEach(function (x) { k += countLeaves(x); });
    return k;
  }
  function fold(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  // Aufklappen wie die Übersicht am Fernseher: je Ebene ist ein Bereich offen, nochmal antippen klappt ihn zu.
  // nav = Pfad der offenen Bereiche (Knoten des Baums).
  var LIMIT = 300, limits = new WeakMap();
  function leafButton(x, data, depth, name) {
    if (x.t === 'live') {
      var progs = x.id && data.epg[x.id] ? data.epg[x.id].filter(function (p) { return p[1] > Date.now() / 1000; }) : [];
      return channelRow({ norm: x.k, name: name || x.n, sub: nowTitle(data.epg, x.id), logo: x.l, progs: progs,
        depth: depth, redraw: function () { drawTree(); } });
    }
    var b = document.createElement('button');
    if (x.k === (devices[sel] || {}).norm) b.className = 'cur';
    var sub = x.t === 'live' ? nowTitle(data.epg, x.id) : '';
    name = name || x.n;
    b.style.marginLeft = depth * 14 + 'px';
    b.style.width = 'calc(100% - ' + depth * 14 + 'px)';
    b.innerHTML = (x.l ? '<img alt="" loading="lazy" src="' + esc(x.l.replace(/^http:/, 'https:')) + '" onerror="this.style.display=\'none\'">' : '') +
      '<span><span class="t">' + esc(name) + '</span>' + (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</span>';
    b.onclick = function () {
      send('play', { norm: x.k });
      toast('Startet auf dem Fernseher: ' + name);
    };
    return b;
  }
  function dirButton(x, depth, path) {
    var open = nav[depth] === x;
    var b = document.createElement('button');
    b.className = 'dir' + (open ? ' open' : '');
    if (open) b.style.top = depth * 56 + 'px';   // offene Bereiche bleiben beim Blättern oben stehen
    b.style.marginLeft = depth * 14 + 'px';
    b.style.width = 'calc(100% - ' + depth * 14 + 'px)';
    var n = x.s ? '' : countLeaves(x);
    b.innerHTML = '<span class="arrow">' + (open ? '▾' : '▸') + '</span><span><span class="t">' + esc(x.n) + '</span></span>' +
      (n ? '<span class="c">' + n + '</span>' : '');
    b.onclick = function () {
      nav = open ? nav.slice(0, depth) : (path || nav.slice(0, depth)).concat(x);
      drawTree();
      if (!open) {
        var all = $('tree').querySelectorAll('button.open');
        var row = all[all.length - 1];
        if (row) row.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (x.s) setTimeout(function () { $('q').focus(); }, 300);
      }
    };
    return b;
  }
  function drawTree() {
    var slug = shownList;
    if (!slug || !trees[slug]) return;
    trees[slug].then(function (data) {
      if (slug !== shownList) return;
      var box = $('tree');
      box.innerHTML = '';
      (function level(children, depth) {
        var lim = limits.get(children) || LIMIT;
        children.slice(0, lim).forEach(function (x) {
          if (x.k) { box.appendChild(leafButton(x, data, depth)); return; }
          box.appendChild(dirButton(x, depth));
          if (nav[depth] !== x) return;
          if (x.s) {
            var q = $('q');
            q.hidden = false;
            q.style.marginLeft = (depth + 1) * 14 + 'px';
            q.style.width = 'calc(100% - ' + (depth + 1) * 14 + 'px)';
            box.appendChild(q);
            var res = document.createElement('div');
            res.id = 'qres';
            box.appendChild(res);
            drawResults(data, depth + 1);
          } else {
            level(x.c || [], depth + 1);
          }
        });
        if (children.length > lim) {
          var more = document.createElement('button');
          more.textContent = 'Weitere ' + (children.length - lim) + ' anzeigen';
          more.style.marginLeft = depth * 14 + 'px';
          more.onclick = function () { limits.set(children, lim + LIMIT); drawTree(); };
          box.appendChild(more);
        }
      })(data.root, 0);
    });
  }
  // Suche: Sender/Filme/Folgen und ganze Serien bzw. Gruppen (die öffnen sich dann an ihrem Platz)
  function drawResults(data, depth) {
    var res = $('qres');
    if (!res) return;
    res.innerHTML = '';
    var q = fold(query.trim());
    if (q.length < 2) { res.innerHTML = '<p class="muted">Mindestens 2 Buchstaben eingeben.</p>'; return; }
    var hits = [];
    (function walk(n, path) {
      (n.c || []).forEach(function (x) {
        if (x.s) return;
        if (path.length && fold(x.ti || x.n).indexOf(q) >= 0) hits.push({ x: x, path: path });
        else if (x.c) walk(x, path.concat(x));
      });
    })({ c: data.root }, []);
    if (!hits.length) { res.innerHTML = '<p class="muted">Nichts gefunden.</p>'; return; }
    hits.slice(0, LIMIT).forEach(function (h) {
      res.appendChild(h.x.k ? leafButton(h.x, data, depth, h.x.ti || h.x.n) : dirButton(h.x, depth, h.path));
    });
    if (hits.length > LIMIT) res.appendChild(Object.assign(document.createElement('p'),
      { className: 'muted', textContent: 'Und ' + (hits.length - LIMIT) + ' weitere – bitte genauer suchen.' }));
  }
  $('q').addEventListener('input', function () {
    query = this.value;
    clearTimeout(drawTree.h);
    drawTree.h = setTimeout(function () {
      var slug = shownList;
      if (slug && trees[slug]) trees[slug].then(function (data) { drawResults(data, (parseInt($('q').style.marginLeft, 10) || 14) / 14); });
    }, 250);
  });

  // ---------- Einstellungen des Sticks (nur Haupt-Link: der Status enthält dann „cfg“) ----------
  var cfgOpen = false;
  function renderCfg(d) {
    var box = $('cfg'), c = d.cfg;
    box.hidden = !c;
    if (!c) return;
    var missing = !c.overlay || !c.install || (c.waechterSwitch && !c.waechter && c.home);
    box.innerHTML = '';
    var head = document.createElement('button');
    head.className = 'head';
    head.innerHTML = '<span>' + (cfgOpen ? '▾' : '▸') + '</span><span>⚙️ Einstellungen' + (missing ? ' ⚠️' : '') + '</span>';
    head.onclick = function () { cfgOpen = !cfgOpen; renderCfg(devices[sel] || {}); };
    box.appendChild(head);
    if (!cfgOpen) return;
    var body = document.createElement('div');
    body.className = 'body';
    function sw(key, label, on) {
      var b = document.createElement('button');
      b.className = 'sw' + (on ? ' on' : '');
      b.innerHTML = '<span>' + esc(label) + '</span><b>' + (on ? 'AN' : 'AUS') + '</b>';
      b.onclick = function () {
        send('setting', { key: key, on: !on });
        toast(label + ' wird ' + (on ? 'ausgeschaltet' : 'eingeschaltet') + ' …');
      };
      body.appendChild(b);
    }
    function chk(ok, yes, no) {
      var p = document.createElement('div');
      p.className = 'chk ' + (ok ? 'yes' : 'no');
      p.textContent = ok ? '✓ ' + yes : '✕ ' + no;
      body.appendChild(p);
    }
    // Ansicht und Liste (wie im Editor)
    var seg = document.createElement('div');
    seg.className = 'seg';
    [['komplett', 'Komplett'], ['senioren', 'Senioren']].forEach(function (v) {
      var b = document.createElement('button');
      b.textContent = v[1];
      if (d.view === v[0]) b.className = 'sel';
      b.onclick = function () {
        if (d.view === v[0]) return;
        send('view', { view: v[0] });
        toast('Ansicht wird umgestellt auf ' + v[1] + ' …');
      };
      seg.appendChild(b);
    });
    body.appendChild(seg);
    if (lists) {
      var selEl = document.createElement('select');
      Object.keys(lists).forEach(function (slug) {
        var o = document.createElement('option');
        o.value = slug;
        o.textContent = 'Liste: ' + (lists[slug].name || slug);
        if (slug === d.list) o.selected = true;
        selEl.appendChild(o);
      });
      selEl.onchange = function () {
        var l = lists[selEl.value];
        if (!confirm('Diesen Fernseher auf die Liste „' + (l.name || selEl.value) + '“ umstellen?\n' +
            'Achtung: Jede Liste hat ihren eigenen Zugang mit nur einer Verbindung.')) { selEl.value = d.list; return; }
        send('list', { link: l.link });
        toast('Liste wird umgestellt …');
      };
      body.appendChild(selEl);
    }
    sw('autostart', 'Autostart beim Einschalten', c.autostart);
    sw('home', 'Home-Taste: App kommt zurück', c.home);
    if (c.normvol !== undefined) sw('normvol', 'Gleichmäßige Lautstärke', c.normvol);
    if (c.waechterOld) {
      chk(false, '', 'Wächter: auf diesem älteren Stick (Fire OS 6) nicht möglich – Updates brauchen einen Klick vor Ort');
    } else if (c.waechterSwitch) {
      sw('waechter', 'Wächter (hält die App vorne, Updates ohne Klick)', c.waechter);
      if (c.waechter) {
        var pb = document.createElement('button');
        pb.className = 'sw';
        pb.innerHTML = '<span>' + (c.pause > 0 ? 'Wächter pausiert noch ' + c.pause + ' Min. – Pause beenden' : 'Wächter 10 Min. pausieren') + '</span><b></b>';
        pb.onclick = function () {
          send('pause', { min: c.pause > 0 ? 0 : 10 });
          toast(c.pause > 0 ? 'Pause wird beendet …' : 'Wächter pausiert 10 Minuten …');
        };
        body.appendChild(pb);
      }
    } else if (c.waechter !== undefined) {
      chk(c.waechter, 'Wächter aktiv', 'Wächter nicht eingerichtet (vor Ort mit „Stick-einrichten“)');
    }
    chk(c.overlay, 'Autostart erlaubt', 'Autostart nicht erlaubt (vor Ort: ☰ 3 s → „Autostart erlauben“)');
    chk(c.install, 'Updates erlaubt', 'Updates nicht erlaubt (vor Ort: ☰ 3 s → „Updates erlauben“)');
    var g = d.diag;
    if (g) {
      var r = g.rssi, p = document.createElement('div');
      p.className = 'muted';
      p.style.marginTop = '8px';
      p.textContent = '📶 ' + (g.net === 'lan' ? 'Kabel (LAN)' : g.net === 'offline' ? 'kein Netz'
        : 'WLAN' + (r === undefined ? '' : (r >= -60 ? ' gut' : r >= -70 ? ' mittel' : ' schwach ⚠️') + ' (' + r + ' dBm)')) +
        ' · heute ' + (g.stalls || 0) + '× Hänger, ' + (g.errors || 0) + '× Fehler';
      body.appendChild(p);
    }
    var acc = Object.keys(accounts).map(function (k) { return accounts[k]; });
    if (acc.length) {
      var ap = document.createElement('div');
      ap.className = 'muted';
      ap.style.marginTop = '6px';
      ap.textContent = '📅 Abos: ' + acc.map(function (a) {
        return a.name + ' bis ' + new Date(a.expires * 1000).toLocaleDateString('de-DE');
      }).join(' · ');
      body.appendChild(ap);
    }
    box.appendChild(body);
  }

  // ---------- Erinnerungen (🔔 beim Sender → Programm → Sendung antippen; der Stick meldet „rem“) ----------
  var bellOpen = null;   // Sender (norm), dessen Programm aufgeklappt ist
  function remOf(d) {
    var r = d && d.rem;
    if (!r) return [];
    return Array.isArray(r) ? r : Object.keys(r).map(function (k) { return r[k]; });
  }
  function isRem(d, norm, t) {
    return remOf(d).some(function (r) { return r.norm === norm && +r.t === +t; });
  }
  function when(sec) {
    var d = new Date(sec * 1000), today = new Date();
    var day = d.toDateString() === today.toDateString() ? '' : ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()] + ' ';
    return day + hhmm(sec);
  }
  function remind(norm, ch, p, on) {
    send('remind', { norm: norm, ch: ch, t: p[0], title: p[2], on: on }, true);
    toast(on ? '🔔 Erinnerung: ' + when(p[0]) + ' „' + p[2] + '“' : 'Erinnerung gelöscht');
  }
  // Zeile eines Senders: antippen = umschalten, 🔔 = Programm zum Erinnern auf-/zuklappen
  function channelRow(o) {
    var d = devices[sel] || {};
    var wrap = document.createElement('div');
    if (o.depth) wrap.style.marginLeft = o.depth * 14 + 'px';
    var row = document.createElement('div');
    row.className = 'row';
    var b = document.createElement('button');
    b.className = 'main' + (o.norm === d.norm ? ' cur' : '');
    b.innerHTML = (o.logo ? '<img alt="" loading="lazy" src="' + esc(o.logo.replace(/^http:/, 'https:')) + '" onerror="this.style.display=\'none\'">' : '') +
      '<span><span class="t">' + esc(o.name) + '</span>' + (o.sub ? '<span class="s">' + esc(o.sub) + '</span>' : '') + '</span>';
    b.onclick = function () { send('play', { norm: o.norm }); toast('Startet auf dem Fernseher: ' + o.name); };
    row.appendChild(b);
    var progs = (o.progs || []).filter(function (p) { return p[1] > Date.now() / 1000; });
    if (progs.length) {
      var has = progs.some(function (p) { return isRem(d, o.norm, p[0]); });
      var bell = document.createElement('button');
      bell.className = 'bell' + (bellOpen === o.norm ? ' open' : '') + (has ? ' set' : '');
      bell.textContent = '🔔';
      bell.title = 'An eine Sendung erinnern';
      bell.onclick = function () { bellOpen = bellOpen === o.norm ? null : o.norm; o.redraw(); };
      row.appendChild(bell);
    }
    wrap.appendChild(row);
    if (bellOpen === o.norm && progs.length) {
      var box = document.createElement('div');
      box.className = 'prog';
      var hint = document.createElement('p');
      hint.className = 'muted';
      hint.textContent = 'Sendung antippen: Eine Minute vorher erscheint am Fernseher „Gleich beginnt … Umschalten“.';
      box.appendChild(hint);
      progs.slice(0, 12).forEach(function (p, i) {
        var on = isRem(d, o.norm, p[0]);
        var pb = document.createElement('button');
        if (on) pb.className = 'on';
        var running = i === 0 && p[0] <= Date.now() / 1000;
        pb.innerHTML = '<span class="tm">' + (running ? 'läuft' : esc(when(p[0]))) + '</span><span>' + (on ? '🔔 ' : '') + esc(p[2]) + '</span>';
        if (running) pb.disabled = true;
        else pb.onclick = function () { remind(o.norm, o.name, p, !on); };
        box.appendChild(pb);
      });
      wrap.appendChild(box);
    }
    return wrap;
  }
  function renderRems(d) {
    var box = $('rems');
    box.innerHTML = '';
    var r = remOf(d).slice().sort(function (a, b) { return a.t - b.t; });
    if (!r.length) return;
    var h = document.createElement('h2');
    h.textContent = '🔔 Erinnerungen';
    box.appendChild(h);
    r.forEach(function (x) {
      var b = document.createElement('button');
      b.innerHTML = '<span><span class="t">' + esc(when(x.t)) + '  ' + esc(x.title) + '</span><span class="s">' + esc(x.ch) + '</span></span><span class="x">✕ löschen</span>';
      b.onclick = function () { remind(x.norm, x.ch, [x.t, 0, x.title], false); };
      box.appendChild(b);
    });
  }

  function renderList() {
    var d = devices[sel] || {};
    var c = channels && channels.items ? channels : null;
    if (lists && d.list && lists[d.list]) c = null;   // Admin: „Alles auf diesem Fernseher“ reicht
    $('lhead').hidden = !c;
    $('list').innerHTML = '';
    if (!c) return;
    $('lhead').textContent = c.group || 'Sender';
    c.items.forEach(function (it) {
      $('list').appendChild(channelRow({ norm: it.k, name: it.n, sub: it.now, logo: it.l, progs: it.p, redraw: renderList }));
    });
  }

  function sendTo(dev, action, arg) {
    return fetch(BASE + 'inbox/' + encodeURIComponent(dev) + '.json', {
      method: 'POST',
      body: JSON.stringify({ action: action, arg: arg || {}, t: Math.floor(Date.now() / 1000) })
    }).catch(function () { /* egal */ });
  }

  function send(action, arg, quiet) {
    if (!sel) return;
    return fetch(BASE + 'inbox/' + encodeURIComponent(sel) + '.json', {
      method: 'POST',
      body: JSON.stringify({ action: action, arg: arg || {}, t: Math.floor(Date.now() / 1000) })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (!quiet) toast('Gesendet ✓');
    }).catch(function (e) { if (!quiet) toast('Nicht gesendet: ' + e.message); });
  }

  document.querySelectorAll('#pad button').forEach(function (b) {
    b.onclick = function () {
      var a = b.getAttribute('data-a');
      if (a === 'message') {
        var text = prompt('Nachricht für den Fernseher:');
        if (text) send('message', { text: text });
        return;
      }
      if (a === 'update' && !confirm('Neue App-Version laden und installieren?')) return;
      if (a === 'restart' && !confirm('App auf diesem Fernseher neu starten? (Liste wird frisch geladen)')) return;
      send(a, a === 'zap' ? { d: +b.getAttribute('data-d') } : {});
    };
  });
  // Livebild (nur Haupt-Link): Stick schickt ~alle 1,5 s ein kleines Standbild, solange es angefordert wird (60 s,
  // die Seite fragt alle 40 s nach). Aus beim Zuklappen, beim Gerätewechsel und wenn die Seite im Hintergrund ist.
  var liveOn = false, liveSrc = null, liveDev = null, liveTimer = null, liveT = 0;
  // Livebild gehört zum Steuerkreuz: läuft, solange es aufgeklappt ist (nur Haupt-Link)
  function updLive() {
    var d = devices[sel] || {};
    var want = dpadOn && !!d.cfg && !document.hidden;
    $('live').hidden = !want;
    if (want === liveOn && (!want || liveDev === sel)) return;
    liveOn = want;
    liveT = 0;
    if (want) liveStart(); else liveStop();
  }
  function liveStop() {
    if (liveSrc) liveSrc.close();
    liveSrc = null;
    clearInterval(liveTimer);
    if (liveDev) sendTo(liveDev, 'shot', { on: false });
    liveDev = null;
  }
  function liveStart() {
    liveStop();
    if (!liveOn || !sel || document.hidden) return;
    liveDev = sel;
    $('liveinfo').textContent = 'Warte auf das erste Bild …';
    sendTo(liveDev, 'shot', { on: true });
    liveTimer = setInterval(function () { if (liveDev) sendTo(liveDev, 'shot', { on: true }); }, 40000);
    var shot = null;
    liveSrc = live(BASE + 'shot/' + encodeURIComponent(liveDev) + '.json', function (path, data, merge) {
      shot = apply(shot || {}, path, data, merge);
      if (shot && shot.img && shot.t > liveT - 1) {
        liveT = shot.t;
        $('liveimg').src = 'data:image/jpeg;base64,' + shot.img;
      }
    });
  }
  setInterval(function () {   // Alter des Bildes anzeigen
    if (!liveOn || !liveT) return;
    var s = Math.round((Date.now() - liveT) / 1000);
    $('liveinfo').textContent = s < 5 ? 'live (Standbild alle 1–2 s, ohne Ton)' : 'Bild von vor ' + s + ' s'
      + (s > 15 ? ' – ist „Fernsehen“ am Fernseher vorne?' : '');
  }, 1000);
  document.addEventListener('visibilitychange', updLive);

  // Steuerkreuz: Tasten wie auf der Fire-TV-Fernbedienung (Fernwartung „key“), auf-/zuklappbar (gemerkt)
  var dpadOn = false;
  try { dpadOn = localStorage.getItem(KEY + '-steuerkreuz') === '1'; } catch (e) { /* egal */ }
  function showDpad() {
    $('dpad').hidden = !dpadOn;
    $('dpadarrow').textContent = dpadOn ? '▾' : '▸';
    updLive();
  }
  $('dpadhead').onclick = function () {
    dpadOn = !dpadOn;
    try { localStorage.setItem(KEY + '-steuerkreuz', dpadOn ? '1' : '0'); } catch (e) { /* egal */ }
    showDpad();
  };
  showDpad();
  document.querySelectorAll('#dpad button').forEach(function (b) {
    b.onclick = function () {
      if (navigator.vibrate) navigator.vibrate(15);
      send('key', { k: b.getAttribute('data-k') }, true);
    };
  });

  // Laufende Sendung (Fortschritt) jede Minute neu zeichnen
  setInterval(render, 60000);
})();
</script>
</body>
</html>
