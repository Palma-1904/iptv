plugins {
    id 'com.android.application'
}

// Adresse der Webapp und Versionsnummer kommen beim Bauen aus dem GitHub-Workflow.
def startUrl = (project.findProperty('startUrl') ?: 'https://example.github.io/iptv/').toString()
if (!startUrl.endsWith('/')) startUrl += '/'

android {
    namespace 'de.iptv.firetv'
    compileSdk 34

    defaultConfig {
        applicationId 'de.iptv.firetv'
        minSdk 22
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        versionName '1.' + ((project.findProperty('versionCode') ?: '1').toString())
        buildConfigField 'String', 'START_URL', "\"${startUrl}\""
        // Fire-TV-Sticks: 32 Bit (ältere) und 64 Bit (neuere) – x86 wird nicht gebraucht
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Native Bibliotheken komprimiert ins APK (kleinerer Download)
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Feste Signatur, damit Updates über die installierte App gehen (Einrichtung bleibt erhalten).
    signingConfigs {
        release {
            storeFile file('../signing/iptv.p12')
            storeType 'pkcs12'
            storePassword 'iptv-firetv'
            keyAlias 'iptv'
            keyPassword 'iptv-firetv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Eingebauter Player: libVLC (spielt alle Tonformate der Sender: MP2, AC3, E-AC3, AAC)
dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    implementation 'com.google.zxing:core:3.5.3'   // QR-Code für die Handy-Fernbedienung
}
